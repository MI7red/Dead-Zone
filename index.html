dialogue.leya.start|Soy Leya, médica. NV-7 convirtió a la gente en infectados. Aún creo en una cura, pero necesitamos registros y provisiones. Tráeme el maletín de la clínica.|Ich bin Leya, Sanitäterin. NV-7 verwandelte Menschen in Infizierte. Ich glaube an Heilung, doch brauche Akten und Vorräte. Hol den Koffer aus der Klinik.|Ben doktor Leya. NV-7 insanları enfektelere çevirdi. Tedaviye inanıyorum ama kayıt ve erzak lazım. Klinikteki tıbbi çantayı getir.
dialogue.leya.findMeds|El maletín está marcado en el mapa M. Ahorra agua y usa protección por la noche.|Der Koffer ist auf Karte M markiert. Spare Wasser und trage nachts Schutz.|Çanta M haritasında. Suyu koru, gece zırh giy.
dialogue.leya.meds|Volviste. Los registros mencionan NV-7. Necesitamos contactar con otros: busca a Marat en la zona industrial.|Du bist zurück. Die Akten nennen NV-7. Wir müssen andere erreichen. Finde Marat im Industriegebiet.|Döndün. Kayıtlar NV-7’den söz ediyor. Başkalarına ulaşmalıyız. Sanayide Marat’ı bul.
dialogue.leya.idle|Seguiré aquí. Una base segura y provisiones nos acercarán a la cura.|Ich bleibe hier. Vorräte und eine sichere Basis bringen uns der Heilung näher.|Buradayım. Erzak ve güvenli üs bizi tedaviye yaklaştırır.
dialogue.leya.research|Vera contactó con Ada. Reúne el archivo de su laboratorio, muestras del paso helado y un estabilizador del páramo. Ada podrá seguir investigando.|Vera hat Ada erreicht. Hole Akten aus ihrem Labor, Frostproben aus dem Pass und den Stabilisator im Ödland. Dann kann Ada weiterforschen.|Vera Ada’ya ulaştı. Onun laboratuvarından arşivi, donmuş geçitten numuneleri, çorak araziden dengeleyiciyi topla. Ada araştırmaya devam edebilir.
dialogue.leya.prototype|Llegó el prototipo. Ada comprobó las muestras y las comparé con los historiales. Falta el desarrollo final y la primera partida.|Der Prototyp ist da. Ada prüfte die Proben; ich verglich die Krankenakten. Jetzt fehlen Abschluss und erste Charge.|Prototip geldi. Ada numuneleri kontrol etti; ben tıbbi kayıtlarla karşılaştırdım. Son aşama ve ilk parti kaldı.
dialogue.leya.final|Estamos listos. Recuperamos la radio, los estudios y protegimos el laboratorio. Completemos la cura NV-7 para que la gente vuelva a vivir.|Wir sind bereit. Funk, Forschung und Labor sind gesichert. Vollenden wir NV-7 und geben Menschen Hoffnung.|Hazırız. Bağlantıyı, araştırmayı ve laboratuvarı kurtardık. NV-7 tedavisini bitirip insanlara umut verelim.
dialogue.leya.done|La cura está lista. El refugio puede ser un lugar de sanación. Gracias por quedarte.|Das Heilmittel ist fertig. Unsere Unterkunft kann nun heilen. Danke, dass du geblieben bist.|Tedavi hazır. Sığınağımız artık iyileştirme yeri. Bizimle kaldığın için sağ ol.
dialogue.marat.start|El transmisor funciona, pero perdió su fuente. Trae la unidad del búnker y 6 metales para el adaptador. Investigar requiere luz y radio.|Der Sender funktioniert, sein Netzteil nicht. Bring das Ersatzteil aus dem Bunker und 6 Metall. Forschung braucht Strom und Funk.|Verici çalışıyor ama güç ünitesi yanmış. Sığınaktaki yedeği ve 6 metal getir. Araştırma güç ve iletişim ister.
dialogue.marat.findCoil|La unidad está en el búnker del páramo, marcado en M. El adaptador necesita 6 metales.|Das Netzteil liegt im Ödlandbunker, auf M markiert. Der Adapter braucht 6 Metall.|Ünite M’de işaretli çorak arazi sığınağında. Adaptöre 6 metal lazım.
dialogue.marat.coil|Esta unidad sirve. Dame 6 metales y restauraré la energía.|Das Netzteil passt. Mit 6 Metall stelle ich die Versorgung her.|Ünite uygun. 6 metal ver, gücü onarayım.
dialogue.marat.buildBase|Construye una base cerrada con cama y armario: un módulo o cimientos rodeados de muros. Usa V.|Baue eine geschlossene Basis mit Bett und Schrank: Modul oder umzäunte Fundamente. Mit V bauen.|Yatak ve dolaplı kapalı üs kur: Modül ya da çevrili temel. İnşa için V.
dialogue.marat.baseReady|Ya tenemos un hogar. Lleva el transmisor a Vera en el puesto nevado.|Jetzt haben wir ein Zuhause. Bring den Sender zu Vera am Schneeposten.|Artık evimiz var. Vericiyi karlı karakoldaki Vera’ya götür.
dialogue.marat.power|La línea está conectada. Activa el generador junto al banco y vuelve con Ada.|Die Leitung steht. Schalte den Generator an der Werkbank ein und geh zu Ada.|Hat bağlı. Tezgâhın yanındaki jeneratörü aç ve Ada’ya dön.
dialogue.marat.idle|Los muros fuertes y la armadura reparada te mantienen vivo.|Starke Wände und gewartete Rüstung halten dich am Leben.|Sağlam duvar ve bakımlı zırh seni yaşatır.
dialogue.vera.start|Transmitiré toda la noche. Sobrevive hasta el siguiente amanecer y vuelve por la respuesta. No puedes dormir durante la guardia.|Ich sende die ganze Nacht. Überlebe bis zum nächsten Morgen und hole die Antwort. Nicht schlafen während der Wache.|Gece boyunca yayın yapacağım. Sonraki şafağa kadar yaşa ve yanıt için dön. Nöbette uyuyamazsın.
dialogue.vera.wait|Solo estática por ahora. Vuelve al amanecer.|Bisher nur Rauschen. Komm im Morgengrauen wieder.|Şimdilik yalnız parazit. Şafakta dön.
dialogue.vera.answer|¡Respondieron! Ada estudia NV-7 en la ciudad y tiene un plan para la cura. Avisa a Leya: la radio solo era el comienzo.|Eine Antwort! Ada erforscht NV-7 in der Stadt und hat einen Plan. Sag Leya Bescheid: Funk war nur der Anfang.|Yanıt geldi! Ada şehirde NV-7 üzerinde çalışıyor, tedavi planı var. Leya’ya söyle: Telsiz sadece başlangıçtı.
dialogue.vera.research|Mantengo unidos el laboratorio y el refugio. Consulta J para la siguiente meta.|Ich verbinde Labor und Unterkunft. Das nächste Ziel steht in J.|Laboratuvar ve sığınak arasında bağlantı kuruyorum. Sonraki hedef J’de.
dialogue.vera.idle|La radio sigue viva. Leya está en la cabaña, Marat en el taller y Ada en el laboratorio.|Der Funk lebt noch. Leya ist in der Hütte, Marat in der Werkstatt, Ada im Labor.|Telsiz hâlâ yaşıyor. Leya kulübede, Marat atölyede, Ada laboratuvarda.
dialogue.ada.idle|Soy Ada. Estudio NV-7. Podremos seguir cuando Leya confirme el plan.|Ich bin Ada und erforsche NV-7. Sobald Leya den Plan bestätigt, geht es weiter.|Ben Ada. NV-7’yi araştırıyorum. Leya planı doğrulayınca devam edebiliriz.
dialogue.ada.samples|Necesitamos el archivo NV-7, las muestras heladas y el estabilizador. Tráeme los tres objetos marcados.|Wir brauchen Archiv, Frostproben und Stabilisator. Bring alle drei markierten Gegenstände.|Arşiv, donmuş numune ve dengeleyici lazım. İşaretli üç eşyayı getir.
dialogue.ada.power|Ya están los materiales. Activa el generador preparado por Marat.|Die Materialien sind da. Schalte Marats Generator ein.|Malzemeler hazır. Marat’ın jeneratörünü aç.
dialogue.ada.begin|El laboratorio está listo. Elige a quién ayudar primero. La duración del ciclo dependerá de esa decisión; si te alejas, se pausa.|Das Labor ist bereit. Entscheide, wem du zuerst hilfst. Das bestimmt die Zyklusdauer; in der Ferne pausiert er.|Laboratuvar hazır. Önce kime yardım edeceğini seç. Döngü süresi bu karara bağlıdır; uzaklaşırsan durur.
dialogue.ada.wait|El ciclo sigue. Quédate cerca y consulta el progreso en J.|Der Zyklus läuft. Bleib in der Nähe; Fortschritt steht in J.|Döngü sürüyor. Yakında kal, ilerlemeyi J’den izle.
dialogue.ada.ready|El prototipo está listo. Llévalo a Leya para la comparación final.|Der Prototyp ist fertig. Bring ihn für den letzten Vergleich zu Leya.|Prototip hazır. Son karşılaştırma için Leya’ya götür.
dialogue.ada.done|Leya te espera para completar el desarrollo.|Leya erwartet dich zum Abschluss.|Leya geliştirmeyi bitirmek için seni bekliyor.
dialogue.leya.sandbox|No hay historia obligatoria aquí. Explora edificios, guarda agua y construye.|Hier gibt es keine Pflichtgeschichte. Plündere Gebäude, sammle Wasser und baue.|Burada zorunlu hikâye yok. Binaları ara, su biriktir, inşa et.
dialogue.marat.sandbox|Construye con V. Cierra muros y puertas; añade cama y armario. Repara armadura con K.|Baue mit V. Schließe Wände und Tore, ergänze Bett und Schrank. Rüstung reparierst du mit K.|V ile inşa et. Duvar ve kapıları kapat, yatak ve dolap koy. Zırhı K ile onar.
dialogue.vera.sandbox|De noche hay más infectados. El mapa M muestra edificios y regiones.|Nachts gibt es mehr Infizierte. Karte M zeigt Gebäude und Regionen.|Geceleri enfekteler artar. M haritası binaları ve bölgeleri gösterir.
dialogue.ada.sandbox|Puedes explorar el laboratorio. La trama de la cura está en el modo historia.|Erkunde das Labor frei. Die Heilmittelhandlung gehört zum Geschichtsmodus.|Laboratuvarı keşfedebilirsin. Tedavi öyküsü Hikâye modunda.

endingText|La cura del virus zombi está desarrollada. Ada terminó la investigación, Leya preparó la primera partida, Marat dio energía y Vera transmitió los resultados. Tu base se convirtió en un lugar al que volver. Las cicatrices siguen, pero el mundo puede recuperarse.|Das Heilmittel ist entwickelt. Ada beendete die Forschung, Leya bereitete die erste Charge vor, Marat lieferte Strom und Vera übermittelte die Ergebnisse. Deine Basis wurde ein Ort der Rückkehr. Narben bleiben, doch die Welt kann sich erholen.|Zombi virüsünün tedavisi geliştirildi. Ada araştırmayı bitirdi, Leya ilk partiyi hazırladı, Marat güç verdi, Vera sonuçları iletti. Üssün dönülecek bir yer oldu. İzler kaldı ama dünya iyileşebilir.

function loadIndustry(s){
  p.materials=cleanMaterials(p.materials);const state=s.industry;resourceElapsed=clamp(Number(state?.elapsed)||0,0,RESOURCE_RENEWAL-.001);resourceCycles=Math.max(0,Math.floor(Number(state?.cycles)||0));craftJob=null;

function craftBlockReason(key,targetId=null){
  const r=recipes[key];if(!r)return tr('missingMaterials');if(craftJob)return tr('jobBusy');if(p.skills.engineering<r.rank)return workText('engineerRequired',{rank:r.rank});if(r.bench&&!nearbyWorkbench())return tr('benchRequired');
  if(Object.entries(r.cost).some(([k,n])=>carried(k)<n))return tr('missingMaterials');
  if(r.output.kind==='weapon'&&p.inventory.length>=6||r.output.kind==='armor'&&p.armory.length>=12)return translateText('Рюкзак полон');
  if(r.output.kind==='repair'){const id=targetId??(r.output.key==='weapon'?equipped()?.id:null),a=repairItem(r.output.key,id);if(!a||a.dur>=a.maxDur)return tr('repairTarget')}
  if(r.output.kind==='wall'&&!barricadeClear(plannedBarricade()))return translateText('Здесь нельзя поставить баррикаду');return '';
}
function beginWork(key,targetId=null){
  if(!started||over)return false;const reason=craftBlockReason(key,targetId);if(reason){toast(reason);return false}const r=recipes[key];
  if(r.output.kind==='repair'&&r.output.key==='weapon'&&targetId===null)targetId=equipped()?.id;
  craftJob={key,duration:Math.max(1,r.seconds*(1-.08*p.skills.engineering)),progress:0,reserved:{...r.cost},targetId,position:r.output.kind==='wall'?plannedBarricade():null};
  for(const [k,n]of Object.entries(r.cost))setCarried(k,carried(k)-n);paused=false;closeModal();clearInput();save();updateHUD();return true;
}
function cancelWork(){if(!craftJob)return false;const job=craftJob;craftJob=null;for(const [k,n]of Object.entries(job.reserved))setCarried(k,carried(k)+n);save();toast(tr('workCancelled'));if(modalTab)renderModal();updateWorkHUD();return true}
function deliverWork(){
  const job=craftJob;if(!job)return false;const r=recipes[job.key],out=r.output;
  if(out.kind==='weapon'&&p.inventory.length>=6||out.kind==='armor'&&p.armory.length>=12)return false;
  if(out.kind==='repair'){const a=repairItem(out.key,job.targetId);if(!a)return false;a.dur=Math.min(a.maxDur,a.dur+(out.key==='weapon'?45:50)+8*p.skills.engineering)}
  if(out.kind==='wall'){if(!barricadeClear(job.position))return false;const hp=220*(1+.25*p.skills.engineering);walls.push({...job.position,hp,maxHp:hp})}
  if(out.kind==='material'||out.kind==='ammo')setCarried(out.key,carried(out.key)+out.amount);
  if(out.kind==='supply')p.supplies[out.key]=(p.supplies[out.key]||0)+out.amount;
  if(out.kind==='weapon')p.inventory.push(createWeapon(out.key));if(out.kind==='armor')p.armory.push(createArmor(out.key));
  const name=recipeName(job.key);craftJob=null;hotbarDirty=true;save();toast(workText('workDone',{name}));return true;
}
function resourceSpotFree(n){const r=n.type==='tree'?34:29;return Math.hypot(n.x-p.x,n.y-p.y)>r+30&&!buildings.some(b=>circleRect(n.x,n.y,r,b))&&!basePieces.some(a=>circleRect(n.x,n.y,r,pieceRect(a)))&&!furniture.some(f=>circleRect(n.x,n.y,r,furnitureRect(f)))&&!npcs.some(a=>Math.hypot(n.x-a.x,n.y-a.y)<r+20)&&!zombies.some(z=>z.hp>0&&Math.hypot(n.x-z.x,n.y-z.y)<r+20)}

function updateIndustry(dt){
