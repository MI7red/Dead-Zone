  if(p.wood<d.wood||p.metal<d.metal)return 'Недостаточно ресурсов';
  if(piece.type==='shelter'){
    if(buildings.some(b=>intersects(r,b,20))||basePieces.some(a=>intersects(r,pieceRect(a),8)))return 'Для модуля нужен свободный участок';

  }else if(piece.type==='foundation'){

  }else{

    if(basePieces.some(a=>a.type!=='foundation'&&a.type!=='shelter'&&intersects(r,pieceRect(a),2)&&!joinsWall(piece,a)))return 'Место занято постройкой';

      if(!house&&!floor)return 'Мебель ставится в доме или на фундаменте';
      if(furniture.some(f=>intersects(r,furnitureRect(f),5)))return 'Место занято мебелью';

function advanceNeeds(dt,moving=false,resting=false){
  if(!Number.isFinite(dt)||dt<=0)return;

  const hRate=HUNGER_RATE*factor,tRate=THIRST_RATE*factor;

  const starving=Math.max(0,dt-oldH/hRate),dehydrated=Math.max(0,dt-oldT/tRate);

  for(const slot of ['head','body','legs','feet'])if(!p.armory.some(a=>a.id===p.armorSlots[slot]&&armorDefs[a.type].slot===slot))p.armorSlots[slot]=null;
  armorDrops=(Array.isArray(s.armorDrops)?s.armorDrops:[]).filter(d=>Number.isFinite(d.x)&&Number.isFinite(d.y)&&cleanArmor(d.armor)).map(d=>({x:d.x,y:d.y,armor:cleanArmor(d.armor)}));
  for(const [id,value]of Object.entries(s.storage||{})){if(storage[id])storage[id].armors=(Array.isArray(value.armors)?value.armors:[]).map(cleanArmor).filter(Boolean).slice(0,12)}
  for(const k of ['notes','specimen','reagent','prototype','validated','cureDeveloped'])story[k]=!!s.story?.[k];
  story.researchProgress=clamp(Number(s.story?.researchProgress)||0,0,120);
  loadChronicle(s);p.bestiary=Array.isArray(p.bestiary)?p.bestiary.filter(k=>zombieDefs[k]):[];p.acidSlow=0;
}
function wornArmor(){return Object.values(p.armorSlots).map(id=>p.armory.find(a=>a.id===id)).filter(a=>a&&a.dur>0)}
function armorStrength(a){return armorDefs[a.type].defense*rarities[a.rarity].power*(.5+.5*a.dur/a.maxDur)}
function armorProtection(){return Math.min(.70,wornArmor().reduce((sum,a)=>sum+armorStrength(a),0))}
function takePhysicalDamage(raw){
  if(raw<=0)return 0;const pieces=wornArmor(),strength=pieces.reduce((s,a)=>s+armorStrength(a),0),blocked=Math.min(raw*Math.min(.7,strength),pieces.reduce((s,a)=>s+a.dur,0)/.6);
  for(const a of pieces){const before=a.dur;a.dur=Math.max(0,a.dur-blocked*.6*armorStrength(a)/(strength||1));if(before>0&&a.dur===0)toast(tr('armorBroken')+translateText(armorDefs[a.type].name))}
  const damage=raw-blocked;p.hp=Math.max(0,p.hp-damage);return damage;
}
function equipArmor(index){const a=p.armory[index];if(!a||a.dur<=0)return toast(tr('repairFirst'));p.armorSlots[armorDefs[a.type].slot]=a.id;save();renderModal()}
function unequipArmor(slot){p.armorSlots[slot]=null;save();renderModal()}

function dropArmor(index){const a=p.armory[index];if(!a)return;for(const slot of Object.keys(p.armorSlots))if(p.armorSlots[slot]===a.id)p.armorSlots[slot]=null;p.armory.splice(index,1);armorDrops.push({...dropPosition(),armor:a});save();renderModal();toast(tr('armorDropped'))}
function craftArmor(type){return craft('armor:'+type)}
function rollArmorLoot(box){if(box.id!=='box-0'&&Math.random()>.4)return;const types=Object.keys(armorDefs),type=box.id==='box-0'?'helmet':types[Math.floor(Math.random()*types.length)];armorDrops.push({x:box.x-28,y:box.y+45,armor:createArmor(type,rollRarity(),true)})}
function armorInteractions(){return armorDrops.filter(d=>Math.hypot(d.x-p.x,d.y-p.y)<80&&traceSolid(p.x,p.y,d.x,d.y)===Infinity).map(obj=>({kind:'armor',obj,dist:Math.hypot(obj.x-p.x,obj.y-p.y)}))}
function interactAdventure(hit){
  if(interactChronicle(hit))return true;
  if(hit.kind==='armor'){if(p.armory.length>=12){toast(tr('armorFull'));return true}p.armory.push(hit.obj.armor);armorDrops.splice(armorDrops.indexOf(hit.obj),1);save();toast(tr('armorFound'));return true}

function adventureQuestObjects(){
  if(gameMode==='sandbox')return [];
  if(story.stage===1&&!story.meds){const b=buildings.find(b=>b.zone===4&&b.kind==='clinic');return [{id:'meds',x:b.x+b.w-55,y:b.y+b.h-62,name:tr('item.meds')}]}
  if(story.stage===3&&!story.coil){const b=buildings.find(b=>b.zone===5&&b.kind==='bunker')||buildings.find(b=>b.zone===5);return [{id:'coil',x:b.x+b.w-55,y:b.y+b.h-62,name:tr('item.coil')}]}
  if(story.stage===8){const ada=npcs.find(n=>n.id==='ada'),lab=buildings.find(b=>b.id===ada.building),cold=buildings.find(b=>b.zone===2&&b.kind==='lab'),waste=buildings.find(b=>b.zone===5&&b.kind==='bunker');return [['notes',lab],['specimen',cold],['reagent',waste]].filter(([id])=>!story[id]).map(([id,b])=>({id,x:b.x+b.w/2+35,y:b.y+b.h-65,name:tr('item.'+id)}))}
  if(story.stage===9){const n=npcs.find(n=>n.id==='marat'),b=buildings.find(b=>b.id===n.building);return [{id:'labPower',action:'powerLab',x:b.x+45,y:b.y+b.h-62,name:tr('powerLab')}]}

function adventureObjective(){
  if(gameMode==='sandbox')return {title:tr('sandbox'),text:tr('sandboxGoal'),target:null};
  const npc=id=>npcs.find(n=>n.id===id);let target=null;
  if(story.stage===0||story.stage===1&&story.meds||story.stage===7||[12,13].includes(story.stage))target=npc('leya');
  if([2,4].includes(story.stage)||story.stage===3&&story.coil)target=story.stage===4&&!baseReady()?null:npc('marat');
  if([5,6].includes(story.stage))target=npc('vera');
  if([8,10,11].includes(story.stage))target=adventureQuestObjects()[0]||npc('ada');
  if([1,3,9].includes(story.stage)&&!target)target=adventureQuestObjects()[0];
  const suffix=story.stage===1&&story.meds?'.return':story.stage===3&&story.coil?'.return':story.stage===4&&baseReady()?'.return':story.stage===6&&clock>=story.target?'.return':'';
  if(chronicle.trackRescue&&!chronicle.rescued&&!chronicle.milaLost)return rescueObjective();
  let text=tr('goal.'+story.stage+suffix);if(story.stage===8)text+=' '+['notes','specimen','reagent'].filter(k=>story[k]).length+'/3';if(story.stage===11)text+=' '+Math.floor(story.researchProgress)+'/'+researchDuration()+' '+tr('seconds');
  return {title:tr('chapter.'+story.stage),text,target};
}
function adventureDialogue(){
  const npc=npcs.find(n=>n.id===selectedNpc);if(!npc)return null;let text=tr('dialogue.'+npc.id+'.idle'),action=null,label='';
  if(gameMode==='sandbox')return {npc,text:tr('dialogue.'+npc.id+'.sandbox'),action:null,label:''};
  const s=story.stage;
  if(npc.id==='leya'){
    if(s===0){text=tr('dialogue.leya.start');action='acceptMeds'}
    else if(s===1){text=tr(story.meds?'dialogue.leya.meds':'dialogue.leya.findMeds');if(story.meds)action='giveMeds'}
    else if(s===7){text=tr('dialogue.leya.research');action='acceptResearch'}
    else if(s===12){text=tr('dialogue.leya.prototype');action='validateCure'}
    else if(s===13){text=tr('dialogue.leya.final');action='finishCure'}
    else if(s===14)text=tr('dialogue.leya.done');
  }
  if(npc.id==='marat'){
    if(s===2){text=tr('dialogue.marat.start');action='acceptCoil'}
    else if(s===3){text=tr(story.coil?'dialogue.marat.coil':'dialogue.marat.findCoil');if(story.coil&&p.metal>=6)action='giveCoil'}
    else if(s===4){text=tr(baseReady()?'dialogue.marat.baseReady':'dialogue.marat.buildBase');if(baseReady())action='reportBase'}
    else if(s===9)text=tr('dialogue.marat.power');
  }
  if(npc.id==='vera'){
    if(s===5){text=tr('dialogue.vera.start');action='startSignal'}
    else if(s===6){text=tr(clock>=story.target?'dialogue.vera.answer':'dialogue.vera.wait');if(clock>=story.target)action='finishStory'}
    else if(s>=7)text=tr('dialogue.vera.research');
  }
  if(npc.id==='ada'){
    if(s===8){text=tr('dialogue.ada.samples');if(story.notes&&story.specimen&&story.reagent)action='submitResearch'}
    else if(s===9)text=tr('dialogue.ada.power');
    else if(s===10){text=tr('dialogue.ada.begin');action='startResearch'}
    else if(s===11){text=tr(story.researchProgress>=researchDuration()?'dialogue.ada.ready':'dialogue.ada.wait');if(story.researchProgress>=researchDuration())action='collectPrototype'}
    else if(s>=12)text=tr('dialogue.ada.done');
  }
  const enriched=enrichDialogue(npc,text,action);text=enriched.text;action=enriched.action;if(action)label=tr('action.'+action);return {npc,text,action,label};
}
function adventureAction(action){
  if(gameMode!=='story')return false;const data=adventureDialogue();if(!data||data.action!==action||Math.hypot(data.npc.x-p.x,data.npc.y-p.y)>95)return false;
  const sideAction=handleChronicleAction(action,data);if(sideAction!==null)return sideAction;
  if(action==='startResearch'&&!chronicle.priority){openDilemma('priority');return true}if(action==='validateCure'&&!chronicle.archivePolicy){openDilemma('archive');return true}
  if(action==='acceptMeds'){story.stage=1;gain(10)}
  if(action==='giveMeds'&&story.meds){story.stage=2;story.meds=false;p.hp=maxHp();p.ammo.light+=12;gain(40)}
  if(action==='acceptCoil'){story.stage=3;gain(10)}
  if(action==='giveCoil'&&story.coil&&p.metal>=6){story.stage=4;story.coil=false;p.metal-=6;p.wood+=8;gain(50)}
  if(action==='reportBase'&&baseReady()){story.stage=5;gain(60)}
  if(action==='startSignal'){story.stage=6;story.target=(Math.floor(clock/CYCLE)+1)*CYCLE;gain(20)}
  if(action==='finishStory'&&clock>=story.target){story.stage=7;const gun=createWeapon('rifle',4);if(p.inventory.length<6)p.inventory.push(gun);else drops.push({...dropPosition(),gun});p.ammo.rifle+=20;p.points+=2;gain(100);hotbarDirty=true}
  if(action==='acceptResearch'){story.stage=8;gain(20)}
  if(action==='submitResearch'&&story.notes&&story.specimen&&story.reagent){story.stage=9;gain(60)}
  if(action==='startResearch'){story.stage=11;story.researchProgress=0;gain(30)}
  if(action==='collectPrototype'&&story.researchProgress>=researchDuration()){story.stage=12;story.prototype=true;gain(60)}
  if(action==='validateCure'&&story.prototype){story.stage=13;story.prototype=false;story.validated=true;gain(40)}
  if(action==='finishCure'&&story.validated){story.stage=14;story.cureDeveloped=true;p.points+=3;const a=createArmor('vest',4);if(p.armory.length<12)p.armory.push(a);else armorDrops.push({...dropPosition(),armor:a});gain(150);modalTab='ending'}
  recordStoryAction(action,data.npc.id);save();if(['startResearch','startSignal'].includes(action)){closeModal();toast(adventureObjective().text)}else renderModal();return true;
}

  document.querySelector('#overlay .mode-panel').appendChild(infoLinks);
  mountMenuAd();
  $('#mode-story').onclick=()=>selectMode('story');$('#mode-sandbox').onclick=()=>selectMode('sandbox');$('#language-select').onchange=e=>setLanguage(e.target.value);$('#start').onclick=beginAdventure;if(savedState)$('#newgame').onclick=resetCurrentMode;localizeUI();
}

function drawArmorDrops(){for(const d of armorDrops)if(visible(d.x,d.y)&&visibleInterior(d.x,d.y)){const color=rarities[d.armor.rarity].color;circle(g,d.x,d.y,18,color+'25');g.save();g.translate(d.x,d.y);g.fillStyle=color;g.beginPath();g.moveTo(-9,-11);g.lineTo(9,-11);g.lineTo(12,4);g.lineTo(0,14);g.lineTo(-12,4);g.closePath();g.fill();g.strokeStyle='#eff0cf';g.lineWidth=1;g.stroke();g.restore()}}

'Return to Ada and begin development.','Adaga qayting va dori yaratishni boshlang.'],'goal.11':['Оставайся рядом с лабораторией до конца цикла.','Stay near the laboratory until the cycle finishes.','Jarayon tugaguncha laboratoriya yaqinida qoling.'],'goal.12':['Забери прототип у Ады и передай Лее.','Take Ada’s prototype to Leya.','Adaning prototipini Leyaga olib boring.'],'goal.13':['Заверши разработку лекарства вместе с Леей.','Complete the cure with Leya.','Leya bilan dori yaratishni yakunlang.'],'goal.14':['Лекарство разработано. Убежище стало началом новой жизни.','The cure is developed. Your shelter is the beginning of a new life.','Dori yaratildi. Boshpanangiz yangi hayotning boshlanishiga aylandi.'],
  'step.0':['Встретить Лею','Meet Leya','Leya bilan uchrashish'],'step.1':['Вернуть медицинский кейс','Recover the medical case','Tibbiy qutini qaytarish'],'step.2':['Найти инженера Марата','Find the engineer Marat','Muhandis Maratni topish'],'step.3':['Восстановить блок питания','Recover the power unit','Quvvat blokini tiklash'],'step.4':['Построить обитаемую базу','Build a livable base','Yashash uchun baza qurish'],'step.5':['Доставить передатчик Вере','Deliver the transmitter to Vera','Uzatgichni Veraga yetkazish'],'step.6':['Дождаться ответа на рассвете','Receive the reply at dawn','Tongda javob olish'],'step.7':['Узнать об исследовании NV-7','Learn about NV-7 research','NV-7 tadqiqotini o‘rganish'],'step.8':['Собрать три исследовательских материала','Collect three research items','Uch tadqiqot buyumini yig‘ish'],'step.9':['Запитать лабораторию','Restore power to the lab','Laboratoriyani quvvatlantirish'],'step.10':['Запустить разработку','Start development','Dori yaratishni boshlash'],'step.11':['Выдержать лабораторное дежурство','Complete the laboratory watch','Laboratoriya navbatchiligini bajarish'],'step.12':['Доставить прототип Лее','Bring the prototype to Leya','Prototipni Leyaga yetkazish'],'step.13':['Завершить разработку лекарства','Complete the cure','Dori yaratishni yakunlash'],
  'dialogue.leya.start':['Я Лея, медик. Вирус NV-7 превратил людей в заражённых. Я всё ещё верю, что можно найти лекарство, но сначала нужны медицинские записи и припасы. Принеси аварийный кейс из городского медпункта.','I’m Leya, the medic. The NV-7 virus turned people into the infected. I still believe there can be a cure, but we need records and supplies first. Bring me the emergency case from the city clinic.','Men Leya, shifokorman. NV-7 virusi odamlarni zararlanganlarga aylantirdi. Dori topish mumkinligiga ishonaman, lekin avval yozuvlar va jihozlar kerak. Shahar tibbiyot punktidagi favqulodda qutini olib keling.'],
  'dialogue.leya.findMeds':['Кейс остался в городском медпункте. Я отметила его на карте M. Береги воду и не выходи ночью без защиты.','The case is in the city clinic, marked on map M. Save your water and wear protection at night.','Quti shahar tibbiyot punktida, M xaritasida belgilangan. Suvni tejang va tunda himoyasiz yurmang.'],
  'dialogue.leya.meds':['Ты вернулся. В записях есть упоминание проекта NV-7. Чтобы узнать больше, нужна связь с другими выжившими. Найди инженера Марата в промзоне.','You made it back. The records mention project NV-7. We need to contact other survivors to learn more. Find Marat in the industrial district.','Qaytib keldingiz. Yozuvlarda NV-7 loyihasi tilga olingan. Ko‘proq bilish uchun boshqa tiriklar bilan aloqa kerak. Sanoat hududidan Maratni toping.'],
  'dialogue.leya.idle':['Я буду здесь. Припасы и безопасная база помогут нам дойти до разработки лекарства.','I’ll be here. Supplies and a secure base will help us reach the cure.','Men shu yerdaman. Zaxiralar va xavfsiz baza dori yaratishgacha yetib borishga yordam beradi.'],
  'dialogue.leya.research':['Вера получила сообщение от исследователя Ады. Архив NV-7 уцелел. Собери записи в её лаборатории, криообразцы на Мёрзлом перевале и стабилизатор в пустоши. Ада сможет продолжить разработку.','Vera heard from researcher Ada. The NV-7 archive survived. Collect the records in her lab, frozen samples in the pass, and a stabilizer in the wasteland. Ada can continue the research.','Vera tadqiqotchi Adadan xabar oldi. NV-7 arxivi saqlanib qolgan. Uning laboratoriyasidagi yozuvlar, qorli dovondagi namunalar va tashlandiq hududdagi stabilizatorni yig‘ing. Ada tadqiqotni davom ettiradi.'],
  'dialogue.leya.prototype':['Прототип доставлен. Ада завершила проверку образцов, а я сопоставила результаты с медицинскими записями. Остался финальный этап разработки и подготовка первой партии.','The prototype is here. Ada has completed the sample checks, and I matched the results with the medical records. Only final development and the first batch remain.','Prototip yetib keldi. Ada namunalarni tekshirdi, men natijalarni tibbiy yozuvlar bilan solishtirdim. Yakuniy ishlab chiqish va birinchi partiya qoldi.'],
  'dialogue.leya.final':['Мы готовы. Вместе мы восстановили связь, собрали исследования и защитили лабораторию. Завершим лекарство NV-7 — и у людей появится шанс вернуться к жизни.','We’re ready. Together we restored communications, recovered the research and protected the lab. Let’s complete the NV-7 cure and give people a chance to live again.','Tayyormiz. Birga aloqani tikladik, tadqiqotlarni yig‘dik va laboratoriyani himoya qildik. NV-7 dorisini yakunlab, odamlarga yana yashash imkonini beramiz.'],
  'dialogue.leya.done':['Лекарство готово. Теперь убежище станет местом помощи, а не только укрытием. Спасибо, что не оставил нас.','The cure is ready. Our shelter can now be a place of healing. Thank you for staying with us.','Dori tayyor. Boshpanamiz endi yordam maskani bo‘ladi. Bizni tashlab ketmaganingiz uchun rahmat.'],
  'dialogue.marat.start':['Передатчик жив, но блок питания выгорел. Принеси резервный блок из бункера пустоши и 6 металла для переходника. Без света и связи исследование не запустить.','The transmitter works, but its power unit is dead. Bring the spare from the wasteland bunker and 6 metal for an adapter. Research needs power and communications.','Uzatgich ishlaydi, lekin quvvat bloki kuygan. Tashlandiq bunkeridagi zaxira blok va adapter uchun 6 metall olib keling. Tadqiqotga elektr va aloqa kerak.'],
  'dialogue.marat.findCoil':['Резервный блок в бункере пустоши. Карта M покажет путь. Для переходника нужно 6 металла.','The spare is in the wasteland bunker. Map M will guide you. The adapter needs 6 metal.','Zaxira blok tashlandiq hudud bunkerida. M xaritasi yo‘l ko‘rsatadi. Adapter uchun 6 metall kerak.'],
  'dialogue.marat.coil':['Блок подходит. Дай мне 6 металла, и я восстановлю питание передатчика.','This unit will work. Give me 6 metal and I’ll restore the transmitter’s power.','Bu blok mos keladi. 6 metall bering, uzatgich quvvatini tiklayman.'],
  'dialogue.marat.buildBase':['Нам нужно место для людей. Построй свою закрытую базу с кроватью и шкафом: модуль убежища или ограждённый фундамент. Меню строительства — V.','We need a place for people. Build a closed base with a bed and wardrobe: a shelter module or an enclosed foundation. Press V to build.','Odamlar uchun joy kerak. Karavot va shkafli yopiq baza quring: boshpana moduli yoki devorli poydevor. Qurilish — V.'],
  'dialogue.marat.baseReady':['Вот теперь есть куда возвращаться. Передатчик готов. Найди Веру на снежном радиопосту.','Now we have a home to return to. The transmitter is ready. Find Vera at the snowy radio post.','Endi qaytadigan uyimiz bor. Uzatgich tayyor. Qorli radiopostdan Verani toping.'],
  'dialogue.marat.power':['Я подключил лабораторную линию. Включи генератор у верстака в этой мастерской, затем возвращайся к Аде.','I connected the lab’s power line. Switch on the generator by the workbench here, then return to Ada.','Laboratoriya tarmog‘ini uladim. Shu ustaxonadagi dastgoh yonidagi generatorni yoqing, so‘ng Adaga qayting.'],
  'dialogue.marat.idle':['Крепкие стены и исправная броня — основа выживания. Не забывай ремонтировать снаряжение.','Strong walls and maintained armor keep you alive. Remember to repair your equipment.','Mustahkam devor va soz zirh hayotni saqlaydi. Jihozlarni ta’mirlashni unutmang.'],
  'dialogue.vera.start':['Я буду передавать сигнал всю ночь. Доживи до следующего рассвета и вернись за ответом. Во время дежурства спать нельзя.','I’ll transmit all night. Stay alive until the next dawn, then return for the reply. You cannot sleep through this watch.','Tun bo‘yi signal yuboraman. Keyingi tonggacha tirik qoling va javob uchun qayting. Bu navbatchilikda uxlash mumkin emas.'],
  'dialogue.vera.wait':['Пока только шум. Передача идёт — возвращайся на рассвете.','Only static so far. The transmission continues. Return at dawn.','Hozircha faqat shovqin. Uzatish davom etmoqda. Tongda qayting.'],
  'dialogue.vera.answer':['Ответ пришёл! В городе работает Ада — исследователь NV-7. У неё есть план продолжения разработки лекарства. Передай эту новость Лее: связь была только началом.','We have a reply! Ada, an NV-7 researcher, is working in the city. She has a plan for the cure. Tell Leya: restoring the radio was only the beginning.','Javob keldi! Shaharda NV-7 tadqiqotchisi Ada ishlayapti. Unda dori yaratish rejasi bor. Leyaga ayting: aloqa tiklanishi faqat boshlanish edi.'],
  'dialogue.vera.research':['Я держу связь между убежищем и лабораторией. Следующая цель отмечена в журнале J.','I’m keeping the shelter and lab connected. Your next objective is in journal J.','Boshpana va laboratoriya aloqasini saqlayapman. Keyingi maqsad J kundaligida.'],
  'dialogue.vera.idle':['Эфир ещё жив. Лея в лесном доме, Марат в промзоне, Ада в городской лаборатории.','The radio is still alive. Leya is in the cabin, Marat in the industrial area, Ada in the city lab.','Aloqa hali tirik. Leya o‘rmon uyida, Marat sanoat hududida, Ada shahar laboratoriyasida.'],
  'dialogue.ada.idle':['Я Ада. Исследую NV-7. Когда Лея подтвердит план, мы сможем продолжить работу.','I’m Ada. I study NV-7. Once Leya confirms the plan, we can continue.','Men Adaman. NV-7 ni o‘rganaman. Leya rejani tasdiqlasa, ishni davom ettiramiz.'],
  'dialogue.ada.samples':['Для продолжения нужны три вещи: архив NV-7, криообразцы и стабилизатор N7. Их точки отмечены на карте. Когда соберёшь всё, передай материалы мне.','We need three items: the NV-7 archive, frozen samples and N7 stabilizer. They are marked on the map. Bring them all to me.','Uchta buyum kerak: NV-7 arxivi, muzlatilgan namunalar va N7 stabilizatori. Joylari xaritada belgilangan. Hammasini menga olib keling.'],
  'dialogue.ada.power':['Материалы на месте. Марат подготовил питание лаборатории. Включи генератор в его мастерской.','The materials are here. Marat prepared the lab power supply. Switch on the generator in his workshop.','Materiallar keldi. Marat laboratoriya quvvatini tayyorladi. Uning ustaxonasidagi generatorni yoqing.'],
  'dialogue.ada.begin':['Лаборатория готова. Запустим разработку опытного образца NV-7. Оставайся рядом с лабораторией 90 секунд активной игры: вне района процесс приостанавливается.','The lab is ready. Let’s begin developing the NV-7 prototype. Stay near the lab for 90 seconds of active play; the process pauses if you leave the area.','Laboratoriya tayyor. NV-7 prototipini yaratishni boshlaymiz. 90 soniya faol o‘yin davomida laboratoriya yonida qoling; uzoqlashsangiz jarayon to‘xtaydi.'],
  'dialogue.ada.wait':['Цикл идёт. Береги себя и оставайся рядом. Прогресс указан в журнале.','The cycle is running. Stay safe and remain nearby. Progress is shown in your journal.','Jarayon davom etmoqda. Ehtiyot bo‘ling va yaqin qoling. Natija kundalikda ko‘rsatiladi.'],
  'dialogue.ada.ready':['Опытный образец готов. Отнеси его Лее — она завершит сопоставление с медицинскими записями.','The prototype is ready. Take it to Leya to complete the comparison with the medical records.','Prototip tayyor. Tibbiy yozuvlar bilan solishtirishni yakunlash uchun uni Leyaga olib boring.'],
  'dialogue.ada.done':['Всё подготовлено. Лея ждёт тебя в доме лесника для завершения разработки.','Everything is prepared. Leya is waiting in the ranger cabin to complete development.','Hammasi tayyor. Leya yakuniy ish uchun o‘rmonchi uyida kutmoqda.'],
  'dialogue.leya.sandbox':['Добро пожаловать в зону. В этом режиме нет обязательного сюжета: обыскивай здания, запасай воду и строй убежище.','Welcome to the zone. There is no mandatory story here: loot buildings, stock water and build a shelter.','Hududga xush kelibsiz. Bu rejimda majburiy hikoya yo‘q: binolarni qidiring, suv yig‘ing va boshpana quring.'],
  'dialogue.marat.sandbox':['Строительство — V. Замкни стены и ворота, поставь кровать и шкаф. Повреждённую броню ремонтируй в меню K.','Build with V. Close your walls and gates, then add a bed and wardrobe. Repair damaged armor in menu K.','Qurilish — V. Devor va darvozalarni yoping, karavot va shkaf qo‘ying. Buzilgan zirhni K menyusida ta’mirlang.'],
  'dialogue.vera.sandbox':['Ночью заражённых больше. Карта M покажет районы и здания; у каждого биома свои припасы.','More infected roam at night. Map M shows districts and buildings; each biome has different supplies.','Tunda zararlanganlar ko‘payadi. M xaritasi hudud va binolarni ko‘rsatadi; har bir muhitda boshqa zaxiralar bor.'],
  'dialogue.ada.sandbox':['В песочнице лаборатория открыта для исследования. Сюжет с лекарством находится в отдельном сюжетном режиме.','The lab is open for exploration in Sandbox. The cure storyline is available in the separate Story mode.','Erkin rejimda laboratoriyani o‘rganish mumkin. Dori haqidagi hikoya alohida hikoya rejimida.'],

  endingTitle:['ФИНАЛ / НОВЫЙ РАССВЕТ','ENDING / A NEW DAWN','YAKUN / YANGI TONG'],cureComplete:['РАЗРАБОТКА ЗАВЕРШЕНА','DEVELOPMENT COMPLETE','YARATISH YAKUNLANDI'],endingHeading:['Надежда получила имя: NV-7.','Hope has a name: NV-7.','Umidning nomi bor: NV-7.'],
  endingText:['Лекарство от зомби-вируса разработано. Ада завершила исследование, Лея подготовила первую партию, Марат обеспечил питание, а Вера передала результаты за периметр. Твоя база стала местом, куда снова идут люди. Эпидемия ещё оставила след, но теперь у мира есть путь к восстановлению.','The cure for the zombie virus has been developed. Ada finished the research, Leya prepared the first batch, Marat supplied power and Vera transmitted the results beyond the perimeter. Your base became a place people can return to. The outbreak left its scars, but the world now has a path to recovery.','Zombi virusiga qarshi dori yaratildi. Ada tadqiqotni yakunladi, Leya birinchi partiyani tayyorladi, Marat quvvat berdi, Vera natijalarni tashqariga uzatdi. Bazangiz odamlar yana qaytadigan maskanga aylandi. Epidemiyaning izi qolgan bo‘lsa ham, endi dunyoda tiklanish yo‘li bor.'],
  endingRewards:['Награда: легендарный бронежилет, 3 очка навыков и 150 опыта.','Reward: legendary body armor, 3 skill points and 150 XP.','Mukofot: afsonaviy zirhli jilet, 3 ko‘nikma ochkosi va 150 tajriba.'],continueWorld:['Продолжить в этом мире','Continue in this world','Shu dunyoda davom etish'],
};

 ['Дом со стенами и дверью. Мебель поставь отдельно. Можно объединить с оградой.','A room with walls and a door. Place furniture separately; add a fence if needed.','Devor va eshikli xona. Mebelni alohida qo‘ying; panjara bilan birlashtiring.'],['Основа для открытой базы. Обнеси фундамент стенами и воротами.','Base flooring. Enclose it with walls and gates.','Baza asosi. Atrofini devor va darvozalar bilan yoping.'],['Прочная стена длиной 128 м. Q поворачивает перед установкой.','A strong 128 m wall. Press Q to rotate before placing.','128 m mustahkam devor. Qo‘yishdan oldin Q bilan aylantiring.'],['Проход в ограде. Открывай и закрывай на F. Заражённые могут выбить ворота.','A passage through your fence. F opens and closes it. Infected can break it.','To‘siqdagi yo‘lak. F bilan ochib-yoping. Zararlanganlar uni buzishi mumkin.'],['Отдых, сон до рассвета и точка возврата. Ставится в доме или на фундаменте.','Rest, sleep until dawn and a respawn point. Place indoors or on a foundation.','Dam olish, tonggacha uyqu va qaytish nuqtasi. Uyda yoki poydevorda qo‘yiladi.'],['Хранит ресурсы, патроны и до 12 единиц оружия. Содержимое сохраняется.','Stores materials, ammo and up to 12 weapons. Contents are saved.','Resurslar, o‘qlar va 12 tagacha qurolni saqlaydi. Ichidagilar saqlanadi.'],['Восстанавливает здоровье рядом, если поблизости нет заражённых.','Heals nearby when no infected are close.','Yaqinda zararlanganlar bo‘lmasa sog‘liqni tiklaydi.'],

 ['Время остановлено, пока открыто это окно.','Time is paused while this window is open.','Bu oyna ochiq paytda vaqt to‘xtaydi.'],['За каждый уровень — одно очко. Каждый навык имеет пять рангов.','One point per level. Each skill has five ranks.','Har darajaga bitta ochko. Har ko‘nikma besh bosqichli.'],['Светлые точки — здания с ящиками. Кольцо — твоя позиция. Входы в здания с южной стороны.','Light markers are buildings with crates. The ring is you. Building entrances face south.','Yorug‘ belgilar — qutili binolar. Halqa — siz. Binolarning kirishi janubda.'],['Площадь ×10','Area ×10','Maydon ×10'],['Открыто районов','Regions explored','O‘rganilgan hududlar'],['ИССЛЕДОВАНО','EXPLORED','O‘RGANILGAN'],['НЕ ИССЛЕДОВАНО','UNEXPLORED','O‘RGANILMAGAN'],
 ['H — быстро поесть · T — быстро попить. При нуле сытости или воды теряется здоровье; при низких запасах персонаж медленнее. В этом окне время остановлено.','H — eat quickly · T — drink quickly. Empty food or water causes damage; low supplies slow you down. Time is paused here.','H — tez ovqatlanish · T — tez ichish. To‘qlik yoki suv tugasa sog‘liq kamayadi; kam zaxira sekinlashtiradi. Bu oynada vaqt to‘xtaydi.'],
 ['Выброшенные вещи остаются на земле и сохраняются. Чтобы подобрать, подойди и нажми E. Оружие можно выбросить в разделе «Снаряжение».','Dropped items remain on the ground and are saved. Approach and press E to pick them up. Drop weapons in the Equipment tab.','Tashlangan buyumlar yerda qoladi va saqlanadi. Yaqinlashib E bilan oling. Qurollar Jihozlar bo‘limida tashlanadi.'],
 ['Новая добыча дерева, металла и патронов — 10% от первоначальной. Доля до целой единицы накапливается между добычами. Инструменты и навыки продолжают давать бонус.','New wood, metal and ammo yields are 10% of the original rate. Fractions accumulate between harvests. Tools and skills still provide bonuses.','Yangi yog‘och, metall va o‘q hosili avvalgi miqdorning 10% ini tashkil qiladi. Kasrlar yig‘ilib, butun birlikka aylanadi. Asbob va ko‘nikma bonuslari saqlanadi.'],
 ['У каждого созданного и найденного оружия случайная редкость: обычное 60% · необычное 25% · редкое 10% · эпическое 4% · легендарное 1%. Редкость увеличивает урон и запас прочности.','Found and crafted weapons have random rarity: common 60% · uncommon 25% · rare 10% · epic 4% · legendary 1%. Rarity increases damage and durability.','Topilgan va yasalgan qurolning noyobligi tasodifiy: oddiy 60% · kam uchraydigan 25% · noyob 10% · epik 4% · afsonaviy 1%. Noyoblik zarar va mustahkamlikni oshiradi.'],
 ['Оружие изнашивается от атак и добычи. Сломанное можно отремонтировать в мастерской. Смена оружия отменяет перезарядку.','Attacking and gathering wear out weapons. Repair broken weapons in the workshop. Switching weapons cancels reloading.','Hujum va yig‘ish qurolni eskirtiradi. Buzilgan qurol ustaxonada ta’mirlanadi. Qurol almashtirilsa qayta o‘qlash bekor bo‘ladi.'],
 ['Выбери постройку → наведи курсор → ЛКМ. Q — повернуть, Esc — отменить, X — разобрать свою постройку под курсором. При установке время идёт.','Choose a structure → aim → click. Q rotates, Esc cancels, X dismantles your structure under the cursor. Time runs during placement.','Inshoot tanlang → kursorni qarating → bosing. Q aylantiradi, Esc bekor qiladi, X kursordagi o‘z inshootingizni buzadi. Qurishda vaqt davom etadi.'],
 ['Вещи в этом шкафу не теряются при возврате к кровати. Хранилища отдельных шкафов независимы. Время остановлено.','Items in this wardrobe are safe when you respawn at a bed. Each wardrobe has separate storage. Time is paused.','Karavotga qaytganda bu shkafdagi buyumlar yo‘qolmaydi. Har shkaf alohida saqlaydi. Vaqt to‘xtatilgan.'],
 ['Сон ночью переносит к рассвету и полностью восстанавливает здоровье. Днём отдых занимает 30 секунд игрового времени и лечит 35 здоровья. Нужны закрытое убежище и отсутствие заражённых рядом.','Night sleep skips to dawn and restores full health. Day rest takes 30 seconds of game time and heals 35 health. You need a closed shelter and no infected nearby.','Tungi uyqu tonggacha o‘tkazib, sog‘liqni to‘liq tiklaydi. Kunduzgi dam 30 soniya o‘yin vaqtini oladi va 35 sog‘liqni tiklaydi. Yopiq boshpana va yaqin atrofda zararlanganlar bo‘lmasligi kerak.'],
 ['Назначь кровать точкой возврата, чтобы после гибели вернуться сюда.','Bind this bed to respawn here after death.','O‘limdan keyin shu yerga qaytish uchun karavotni belgilang.'],['Эта кровать — твоя точка возврата.','This bed is your respawn point.','Bu karavot sizning qaytish nuqtangiz.'],['Назначить точкой возврата','Set respawn point','Qaytish nuqtasi qilish'],['Спать до рассвета','Sleep until dawn','Tonggacha uxlash'],['Отдохнуть · 30 секунд','Rest · 30 seconds','Dam olish · 30 soniya'],['Убежище безопасно.','The shelter is safe.','Boshpana xavfsiz.'],

 ['Оружие перезаряжено','Weapon reloaded','Qurol qayta o‘qlandi'],['Магазин уже полон','Magazine is already full','O‘qdon to‘la'],['Нет запасных патронов этого типа. Создай их на B.','No reserve ammo of this type. Craft it with B.','Bu turdagi zaxira o‘q yo‘q. B orqali yasang.'],['Оружие ближнего боя не требует патронов','Melee weapons do not need ammo','Yaqin jang quroliga o‘q kerak emas'],['Оружие сломано — нужен ремонт (B)','Weapon broken — repair it (B)','Qurol buzilgan — ta’mirlash kerak (B)'],['Оружие сломано. Отремонтируй в мастерской (B).','Weapon broken. Repair it in the workshop (B).','Qurol buzildi. Ustaxonada ta’mirlang (B).'],['Оружие сломано. Ремонт — B; смена — 1–6.','Weapon broken. B to repair; 1–6 to switch.','Qurol buzilgan. Ta’mir — B; almashtirish — 1–6.'],['Оружие уже целое','Weapon is already repaired','Qurol allaqachon soz'],['Возьми оружие для ремонта','Hold a weapon to repair it','Ta’mirlash uchun qurolni oling'],['Здоровье уже полное','Health is already full','Sog‘liq to‘la'],
 ['Нужен свободный навык, максимум — 5 рангов','Need a skill point; maximum 5 ranks','Ko‘nikma ochkosi kerak; ko‘pi bilan 5 bosqich'],['Недостаточно дерева или металла','Not enough wood or metal','Yog‘och yoki metall yetarli emas'],['Нет места. Выброси оружие в меню I.','No space. Drop a weapon in menu I.','Joy yo‘q. I menyusida qurolni tashlang.'],['Рюкзак полон. Выброси ненужное оружие в меню I.','Backpack full. Drop an unwanted weapon in menu I.','Ryukzak to‘la. I menyusida keraksiz qurolni tashlang.'],['Рюкзак полон','Backpack full','Ryukzak to‘la'],['В шкафу нет места для оружия','No weapon space in this wardrobe','Shkafda qurol uchun joy yo‘q'],['Подойди к шкафу и нажми E.','Approach a wardrobe and press E.','Shkafga yaqinlashib E bosing.'],

function translateText(text){if(language==='ru')return text;const index=LANGUAGE_INDEX[language]-1;if(text.trim()==='с')return text.replace('с',tr('seconds'));return text.replace(phrasePattern,match=>phraseMap.get(match)?.[index]||phraseMap.get(match)?.[0]||match).replace(/(\d(?:[.,]\d+)?) с(?=\s|$)/g,'$1 '+tr('seconds'))}

  const walker=document.createTreeWalker(document.body,4);let node;while((node=walker.nextNode())){
    if(['SCRIPT','STYLE','OPTION'].includes(node.parentElement?.tagName))continue;
    const old=originalText.get(node),source=old&&node.nodeValue===old.output?old.source:node.nodeValue;if(!source?.trim())continue;
    const output=translateText(source);if(node.nodeValue!==output)node.nodeValue=output;originalText.set(node,{source,output});
  }
  for(const el of document.querySelectorAll('[title],[aria-label]')){let data=originalAttributes.get(el)||{};for(const attr of ['title','aria-label']){const value=el.getAttribute(attr);if(value===null)continue;const old=data[attr],source=old&&value===old.output?old.source:value,output=translateText(source);if(value!==output)el.setAttribute(attr,output);data[attr]={source,output}}originalAttributes.set(el,data)}

function updateZombieCombat(dt){
  p.acidSlow=Math.max(0,(p.acidSlow||0)-dt);const inside=buildingAt(p.x,p.y),night=isNight();

        if(z.kind==='brute'){if(dist<66&&line){attackTarget(target,def.damage);if(target===p)move(p,Math.cos(z.aim)*20,Math.sin(z.aim)*20)}z.abilityCD=1.8;z.ring=.35}
        if(z.kind==='spitter'){const a=Math.atan2(target.y-z.y,target.x-z.x);acidShots.push({x:z.x,y:z.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,t:3});z.abilityCD=4.5}
        if(z.kind==='screecher'){for(const other of zombies)if(other.hp>0&&Math.hypot(other.x-z.x,other.y-z.y)<600){other.alert=10;other.nav=0;other.way=null}z.abilityCD=13;z.ring=.9}
      }
    }else if(z.state==='charge'){
      z.charge=Math.max(0,z.charge-dt);move(z,z.dx*150*(night?1.1:1)*dt,z.dy*150*(night?1.1:1)*dt,def.radius);
      if(dist<32&&line&&!z.chargeHit){attackTarget(target,4);z.chargeHit=true}if(z.charge===0)z.state=null;
    }else{
      if(z.abilityCD===0&&line&&((z.kind==='runner'&&dist>90&&dist<310)||(z.kind==='brute'&&dist<73)||(z.kind==='spitter'&&dist>90&&dist<470)||(z.kind==='screecher'&&dist<440))){z.state='windup';z.windup=z.kind==='brute'?.65:z.kind==='runner'?.4:z.kind==='spitter'?.7:1;z.aim=Math.atan2(target.y-z.y,target.x-z.x)}
      else{let goal=routeToActor(z,target);if(z.kind==='spitter'&&line&&dist<210){const a=Math.atan2(z.y-target.y,z.x-target.x);goal={x:z.x+Math.cos(a)*90,y:z.y+Math.sin(a)*90}}navigate(z,goal.x,goal.y,dt,def.speed*(night?1.2:1))}
    }
    for(const b of buildings.concat(basePieces.filter(b=>b.type==='gate')))if(!b.doorOpen&&b.doorHp>0&&circleRect(z.x,z.y,def.radius+14,doorRect(b))){b.doorHp=Math.max(0,b.doorHp-(z.kind==='brute'?31:15)*dt);if(b.doorHp===0){b.doorOpen=true;toast('Заражённые выбили дверь!')}}
    for(const b of walls)if(circleRect(z.x,z.y,def.radius+9,{x:b.x-30,y:b.y-10,w:60,h:20}))b.hp-=(z.kind==='brute'?30:17)*dt;
    if(z.kind!=='brute'&&dist<def.radius+15&&line)attackTarget(target,def.damage*dt);
  }
  for(const a of acidShots){
    const ex=a.x+a.vx*dt,ey=a.y+a.vy*dt,wall=traceSolid(a.x,a.y,ex,ey);let target=p,hit=segmentCircle(a.x,a.y,ex,ey,p,16),mila=activeEscort();
    if(mila){const t=segmentCircle(a.x,a.y,ex,ey,mila,15);if(t<hit){hit=t;target=mila}}
    const t=Math.min(wall,hit);if(t<=1){const pos={x:a.x+(ex-a.x)*Math.max(0,t-.02),y:a.y+(ey-a.y)*Math.max(0,t-.02)};if(hit<wall){if(target===p)acidDamage(8);else injureMila(8)}acidPools.push({...pos,t:3.5});a.t=0}else{a.x=ex;a.y=ey;a.t-=dt}

}
function acidDamage(raw){const suit=wornArmor().find(a=>a.type==='hazmat');const damage=raw*(suit?.dur>0?.4:1);p.hp=Math.max(0,p.hp-damage);if(suit)suit.dur=Math.max(0,suit.dur-damage*.25)}

function endingConsequencesHTML(){if(gameMode!=='story')return '';return '<div class="ending-consequences"><h3>'+tr('yourLegacy')+'</h3><p>'+tr(chronicle.rescued?'epilogue.rescued':chronicle.milaLost?'epilogue.lost':'epilogue.missing')+'</p><p>'+tr(chronicle.priority==='aid'?'epilogue.aid':'epilogue.research')+'</p><p>'+tr(chronicle.archivePolicy==='open'?'epilogue.open':'epilogue.sealed')+'</p><p class="summary">'+tr('evidence')+' '+chronicle.evidence.length+'/5 · '+tr('epilogueTruth')+'</p></div>'}
function drawChronicleWorld(){for(const r of chronicleObjects())if(visible(r.x,r.y)&&visibleInterior(r.x,r.y)){g.fillStyle='#cfbc86';g.fillRect(r.x-8,r.y-10,16,20);g.strokeStyle='#544f38';g.lineWidth=1;for(let i=0;i<3;i++){g.beginPath();g.moveTo(r.x-4,r.y-5+i*5);g.lineTo(r.x+4,r.y-5+i*5);g.stroke()}}const m=activeEscort();if(m&&visible(m.x,m.y)){g.fillStyle='#14231a';g.fillRect(m.x-20,m.y-35,40,4);g.fillStyle='#d6c48b';g.fillRect(m.x-20,m.y-35,40*chronicle.milaHP/80,4)}}
function drawChronicleMap(ctx,scale,ox,oy,large){if(gameMode!=='story')return;ctx.fillStyle='#cbb98a';for(const r of chronicleObjects()){const x=ox+r.x*scale,y=oy+r.y*scale;ctx.fillRect(x-2,y-2,4,5)}if(large){const m=npcs.find(n=>n.id==='mila');if(m){ctx.fillStyle='#d8c58f';ctx.fillText(translateText(m.name),ox+m.x*scale+5,oy+m.y*scale+10)}}}

const LANGUAGE_NAMES={ru:'Русский',en:'English',uz:'O‘zbekcha',es:'Español',de:'Deutsch',tr:'Türkçe'};
COPY['dialogue.ada.begin']=['Лаборатория готова. Сначала решим, кому направить припасы: выжившим или исследованию. От этого зависит длительность цикла. Во время разработки оставайся рядом: за пределами района работа приостанавливается.','The lab is ready. First decide whether supplies go to survivors or research. This determines the cycle duration. Stay nearby during development: the process pauses outside the area.','Laboratoriya tayyor. Avval zaxiralar tiriklarga yoki tadqiqotga berilishini tanlang. Jarayon vaqti shunga bog‘liq. Yaqinda qoling: hududdan chiqsangiz ish to‘xtaydi.'];
Object.assign(COPY,{
  storyDescription:['Пять выживших, тайна NV-7, спасение близких и решения на пути к лекарству.','Five survivors, the NV-7 mystery, a rescue and choices on the path to a cure.','Besh tirik qolgan, NV-7 siri, qutqaruv va doriga eltuvchi qarorlar.','Cinco supervivientes, el misterio NV-7, un rescate y decisiones hacia la cura.','Fünf Überlebende, das NV-7-Rätsel, eine Rettung und Entscheidungen bis zum Heilmittel.','Beş kurtulan, NV-7 gizemi, bir kurtarma ve tedavi yolunda seçimler.'],
  bestiaryTitle:['ЗАРАЖЁННЫЕ / ПОЛЕВОЙ СПРАВОЧНИК','INFECTED / FIELD GUIDE','ZARARLANGANLAR / QO‘LLANMA','INFECTADOS / GUÍA DE CAMPO','INFIZIERTE / FELDHANDBUCH','ENFEKTELER / SAHA REHBERİ'],
  bestiaryIntro:['Пять видов заражённых. Рывки, тяжёлые удары, плевки и крик имеют подготовку. Стены блокируют атаки; броня исследователя снижает урон кислоты.','Five infected types. Charges, heavy blows, spit and screams have a windup. Walls block attacks; the research suit reduces acid damage.','Besh xil zararlangan. Sakrash, og‘ir zarba, tupurish va qichqiriq oldidan tayyorlanadi. Devorlar himoya qiladi; tadqiqotchi kiyimi kislota zararini kamaytiradi.','Cinco tipos. Las cargas, golpes, escupitajos y gritos se anticipan. Los muros bloquean ataques; el traje reduce el ácido.','Fünf Arten. Ansturm, Schläge, Spucken und Schreie kündigen sich an. Wände blockieren Angriffe; der Forschungsanzug schützt vor Säure.','Beş tür. Atılma, ağır darbe, tükürme ve çığlık önceden belli olur. Duvarlar saldırıları keser; araştırma kıyafeti asit hasarını azaltır.'],
  enemySeen:['Встречен','Encountered','Uchratilgan','Encontrado','Gesichtet','Karşılaşıldı'],enemyUnknown:['Полевые сведения','Field reports','Dala ma’lumoti','Informes','Feldberichte','Saha bilgisi'],healthStat:['Здоровье','Health','Sog‘liq','Salud','Gesundheit','Sağlık'],speedStat:['Скорость','Speed','Tezlik','Velocidad','Tempo','Hız'],
  'enemy.walker':['Бродяга','Shambler','Daydi','Errante','Schlurfer','Aylak'],'enemy.runner':['Бегун','Runner','Yuguruvchi','Corredor','Läufer','Koşucu'],'enemy.brute':['Громила','Brute','Bahodir','Bruto','Koloss','İri Yarı'],'enemy.spitter':['Плевальщик','Spitter','Tupuruvchi','Escupidor','Spucker','Tüküren'],'enemy.screecher':['Крикун','Screecher','Qichqiruvchi','Chillón','Kreischer','Çığlıkçı'],
  'enemyDesc.walker':['Чуть крепче и быстрее прежних заражённых. Опасен в группе; держи дистанцию.','Slightly tougher and faster than before. Dangerous in groups; keep your distance.','Avvalgidan biroz kuchliroq va tezroq. Guruhda xavfli; masofa saqlang.','Algo más fuerte y rápido. Peligroso en grupo: mantén distancia.','Etwas zäher und schneller. In Gruppen gefährlich: Abstand halten.','Biraz daha dayanıklı ve hızlı. Gruplar tehlikelidir; mesafeni koru.'],
  'enemyDesc.runner':['Перед рывком замирает и смотрит в твою сторону. Уходи вбок: во время рывка он плохо поворачивает.','Pauses before charging. Dodge sideways: it cannot turn well during the rush.','Otilishdan oldin to‘xtaydi. Yon tomonga qoching: otilishda yaxshi burila olmaydi.','Se detiene antes de cargar. Esquiva de lado: gira mal durante la carrera.','Hält vor dem Ansturm inne. Seitlich ausweichen: Beim Sturm dreht er kaum.','Atılmadan önce durur. Yana kaç: Atılırken zor döner.'],
  'enemyDesc.brute':['Медленный, живучий, быстро ломает двери. Тяжёлый удар готовится 0,65 секунды — успей отойти.','Slow and tough; breaks doors quickly. Its heavy blow has a 0.65-second windup: step away.','Sekin va bardoshli; eshikni tez buzadi. Og‘ir zarba 0,65 soniya tayyorlanadi: chetga chiqing.','Lento y resistente; rompe puertas. Su golpe tarda 0,65 s: apártate.','Langsam und zäh, zerstört Türen schnell. Sein Schlag lädt 0,65 Sekunden: Zurückweichen.','Yavaş ve dayanıklı; kapıları kırar. Ağır vuruşu 0,65 saniye hazırlanır: Uzaklaş.'],
  'enemyDesc.spitter':['Держит дистанцию и плюёт кислотой. Уклоняйся от сгустков и луж; закрытая дверь остановит плевок.','Keeps its distance and spits acid. Avoid globs and pools; a closed door stops the spit.','Masofa saqlab kislota tupuradi. Tomchi va ko‘lmakdan qoching; yopiq eshik tupukni to‘sadi.','Escupe ácido a distancia. Evita proyectiles y charcos; una puerta cerrada los bloquea.','Spuckt Säure aus der Distanz. Geschossen und Pfützen ausweichen; geschlossene Türen halten sie auf.','Uzaktan asit tükürür. Toplardan ve birikintilerden kaç; kapalı kapı tükürüğü durdurur.'],
  'enemyDesc.screecher':['Крик тревожит ближайших заражённых, но не создаёт бесконечную орду. Попадание прерывает подготовку крика.','Its scream alerts nearby infected without spawning an endless horde. Hitting it interrupts the scream.','Qichqirig‘i yaqin zararlanganlarni ogohlantiradi, cheksiz to‘da yaratmaydi. Zarba qichqiriqni to‘xtatadi.','Alerta a los infectados cercanos, sin crear hordas infinitas. Un impacto interrumpe el grito.','Alarmiert nahe Infizierte, erzeugt aber keine endlose Horde. Treffer unterbrechen den Schrei.','Yakındaki enfekteleri uyarır; sonsuz sürü yaratmaz. İsabet çığlığı keser.'],
  personalTalk:['Личный разговор','Personal conversation','Shaxsiy suhbat','Conversación personal','Persönliches Gespräch','Kişisel konuşma'],investigation:['Расследование NV-7','NV-7 investigation','NV-7 tergovi','Investigación NV-7','NV-7-Ermittlungen','NV-7 soruşturması'],investigationHint:['Записи объясняют происхождение вспышки и прошлое героев. Прочитанные документы сохраняются здесь.','Records reveal the outbreak and the survivors’ past. Read documents are kept here.','Yozuvlar epidemiya va qahramonlar o‘tmishini ochadi. O‘qilgan hujjatlar shu yerda.','Los documentos revelan el brote y el pasado del grupo. Aquí se guardan los leídos.','Dokumente erklären den Ausbruch und die Vergangenheit. Gelesene Akten bleiben hier.','Belgeler salgını ve grubun geçmişini anlatır. Okunanlar burada saklanır.'],
  companions:['Выжившие','Survivors','Omon qolganlar','Supervivientes','Überlebende','Kurtulanlar'],trust:['Доверие','Trust','Ishonch','Confianza','Vertrauen','Güven'],decisions:['Принятые решения','Decisions made','Qarorlar','Decisiones tomadas','Getroffene Entscheidungen','Verilen kararlar'],evidence:['Доказательства','Evidence','Dalillar','Pruebas','Beweise','Kanıtlar'],readRecord:['Прочитать: ','Read: ','O‘qish: ','Leer: ','Lesen: ','Oku: '],recordSaved:['Документ сохранён в журнале J.','Document saved in journal J.','Hujjat J kundaligida saqlandi.','Documento guardado en J.','Dokument im Journal J gespeichert.','Belge J günlüğüne kaydedildi.'],
  'recordTitle.ward':['Журнал закрытого отделения','Sealed ward log','Yopiq bo‘lim jurnali','Registro del pabellón','Protokoll der geschlossenen Station','Kapalı servis kaydı'],'recordTitle.blackout':['Приказ об отключении','Blackout order','Quvvatni uzish buyrug‘i','Orden de apagón','Abschaltbefehl','Kesinti emri'],'recordTitle.silence':['Неотправленная радиограмма','Unsent radio message','Yuborilmagan radioxabar','Radiograma sin enviar','Ungesendeter Funkspruch','Gönderilmemiş telsiz mesajı'],'recordTitle.protocol':['Протокол «Север»','Northern protocol','Shimol bayonnomasi','Protocolo Norte','Nord-Protokoll','Kuzey protokolü'],'recordTitle.mila':['Страница из блокнота Милы','Page from Mila’s notebook','Mila daftaridan sahifa','Página del cuaderno de Mila','Seite aus Milas Notizbuch','Mila’nın defterinden sayfa'],
  'recordText.ward':['«Отделение закрыли до объявления карантина. Сёстры Лея и Мила отказались оставлять пациентов. Некоторые заражённые ещё узнавали голоса близких. Руководство требовало записывать всех как потерянных». Лекарство стало для Леи не абстрактной целью, а обещанием.','“The ward was sealed before quarantine was announced. Sisters Leya and Mila refused to abandon patients. Some infected still recognized familiar voices. Management ordered everyone listed as lost.” For Leya, a cure became a promise.','«Karantin e’lonidan oldin bo‘lim yopildi. Opa-singil Leya va Mila bemorlarni tashlamadi. Ayrim zararlanganlar yaqin ovozlarni tanidi. Rahbariyat barchani yo‘qotilgan deb yozishni buyurdi». Leya uchun dori — va’da.','«Cerraron el pabellón antes de anunciar la cuarentena. Las hermanas Leya y Mila no abandonaron a los pacientes. Algunos infectados reconocían voces. La dirección ordenó darlos por perdidos». Para Leya, la cura es una promesa.','„Die Station wurde vor der Quarantäne versiegelt. Leya und Mila blieben bei den Patienten. Einige Infizierte erkannten vertraute Stimmen. Die Leitung erklärte alle für verloren.“ Für Leya wurde das Heilmittel zum Versprechen.','“Servis karantina açıklanmadan kapatıldı. Leya ile kardeşi Mila hastaları bırakmadı. Bazı enfekteler tanıdık sesleri hâlâ tanıyordu. Yönetim hepsinin kayıp yazılmasını emretti.” Leya için tedavi bir sözdü.'],
  'recordText.blackout':['«Подписано инженером Маратом: отключить внешнюю линию по приказу штаба. Больничный контур оставить на резерве». Резерв проработал сорок минут. В приписке Марат спрашивает, почему штаб скрыл неисправность. Он не создавал вирус, но всю жизнь будет помнить выключатель.','“Engineer Marat: disconnect the outside line by headquarters’ order. Keep the hospital on reserve.” Backup lasted forty minutes. A note asks why headquarters hid the fault. Marat did not create the virus, but remembers the switch.','«Muhandis Marat: shtab buyrug‘i bilan tashqi tarmoq uzilsin. Kasalxona zaxirada qolsin». Zaxira qirq daqiqa ishlagan. Marat nosozlik nega yashirilganini so‘raydi. Virusni u yaratmagan, lekin tugmani unutmaydi.','«Ingeniero Marat: cortar la línea externa por orden del mando. Mantener el hospital con reserva». Duró cuarenta minutos. Una nota pregunta por qué ocultaron la avería. Marat no creó el virus, pero recuerda el interruptor.','„Ingenieur Marat: Außenleitung auf Befehl trennen. Krankenhaus auf Reserve lassen.“ Die Reserve hielt vierzig Minuten. Eine Notiz fragt, warum der Defekt verschwiegen wurde. Marat schuf das Virus nicht, doch vergisst den Schalter nie.','“Mühendis Marat: karargâh emriyle dış hattı kesin. Hastaneyi yedekte tutun.” Yedek güç kırk dakika sürdü. Notta arızanın neden saklandığı soruluyor. Virüsü Marat yaratmadı, ama düğmeyi unutamıyor.'],
  'recordText.silence':['Вера получила координаты живых людей за сутки до нашего сигнала. Ответить ей запретили: передачу могли перехватить. Она сохранила запись и нарушила приказ позже. Теперь восстановить связь для неё — значит перестать прятаться за чужим решением.','Vera received survivors’ coordinates a day before our signal. She was forbidden to reply because the transmission could be intercepted. She kept the recording and later disobeyed. Restoring contact means owning her decisions.','Vera signalimizdan bir kun oldin tiriklar koordinatasini olgan. Xabar ushlanishi mumkinligi uchun javob taqiqlangan. U yozuvni saqlab, keyin buyruqni buzgan. Aloqani tiklash — o‘z qaroriga javob berish.','Vera recibió coordenadas de supervivientes un día antes. Le prohibieron responder por riesgo de interceptación. Conservó la grabación y luego desobedeció. Recuperar la radio significa decidir por sí misma.','Vera empfing einen Tag früher Koordinaten Überlebender. Antworten war wegen Abhörgefahr verboten. Sie behielt die Aufnahme und gehorchte später nicht mehr. Kontakt heißt für sie, selbst Verantwortung zu tragen.','Vera koordinatları bir gün önce almıştı. Yayın dinlenebilir diye yanıt vermesi yasaklandı. Kaydı sakladı, sonra emre karşı geldi. Bağlantıyı kurmak artık kendi kararının sorumluluğunu almak demek.'],
  'recordText.protocol':['NV-7 начинался как исследование защиты нервной системы, а не оружие. Ада требовала остановить программу после первых осложнений. Вместо остановки изменили отчётность. Во время аварийного отключения разрушилась изоляция. Вспышку создала цепь скрытых ошибок.','NV-7 began as nervous-system protection research, not a weapon. Ada demanded a halt after early complications. Reports were altered instead. The blackout broke containment. A chain of concealed errors caused the outbreak.','NV-7 qurol emas, asab tizimini himoyalash tadqiqoti edi. Ada ilk asoratlardan keyin to‘xtatishni talab qilgan. Buning o‘rniga hisobot o‘zgartirilgan. Quvvat uzilganda izolyatsiya buzilgan. Yashirilgan xatolar epidemiyaga olib kelgan.','NV-7 investigaba protección neurológica, no era un arma. Ada pidió detenerlo tras las primeras complicaciones. Alteraron los informes. El apagón rompió la contención: errores ocultos causaron el brote.','NV-7 erforschte Nervenschutz, keine Waffen. Ada verlangte nach Komplikationen den Abbruch. Stattdessen wurden Berichte verfälscht. Der Stromausfall brach die Eindämmung. Verheimlichte Fehler lösten den Ausbruch aus.','NV-7 silah değil, sinir sistemi koruma araştırmasıydı. Ada komplikasyonlar çıkınca durdurulmasını istedi. Raporlar değiştirildi. Kesinti karantinayı bozdu. Gizlenen hatalar zinciri salgını doğurdu.'],
  'recordText.mila':['«Если Лея читает это, я ещё иду. Я вывела людей к болотам, потому что лесную дорогу перекрыли. Мы не обязаны знать, кто виноват, чтобы помочь тому, кто рядом». Последняя строка: «Кабина у старого настила. Нужна вода».','“If Leya reads this, I’m still moving. I led people to the marsh after the forest road was blocked. We don’t need to know who is guilty to help whoever is beside us.” Last line: “Cabin near the old walkway. Need water.”','«Leya buni o‘qisa, men hali yo‘ldaman. O‘rmon yo‘li yopilgach, odamlarni botqoqqa olib bordim. Yonimizdagiga yordam berish uchun aybdorni bilish shart emas». Oxirgi satr: «Eski yo‘lak yonidagi uy. Suv kerak».','«Si Leya lee esto, sigo en camino. Llevé al grupo al pantano tras cerrar la carretera. No hace falta saber quién tiene la culpa para ayudar al de al lado». Última línea: «Cabaña junto a la pasarela. Necesito agua».','„Wenn Leya das liest, bin ich noch unterwegs. Ich führte die Leute ins Moor, nachdem die Waldstraße gesperrt wurde. Man muss keine Schuldigen kennen, um anderen zu helfen.“ Letzte Zeile: „Hütte am Steg. Brauche Wasser.“','“Leya bunu okursa hâlâ yürüyorum. Orman yolu kapanınca insanları bataklığa götürdüm. Yanımızdakine yardım etmek için suçluyu bilmek zorunda değiliz.” Son satır: “Eski geçidin yanındaki kulübe. Su lazım.”'],
  'personal.leya':['Мила — моя сестра. Я осталась у пациентов, она вывела людей через болота. Я не прошу выбрать её вместо лекарства. Я прошу не забывать, ради кого мы его ищем. После первых заданий помоги мне найти её.','Mila is my sister. I stayed with the patients; she led people through the marsh. I’m not asking you to choose her over the cure. Remember who the cure is for. Help me find her after our first tasks.','Mila — singlim. Men bemorlar bilan qoldim, u odamlarni botqoqdan olib o‘tdi. Uni doridan ustun qo‘yishni so‘ramayman. Dorini kim uchun izlayotganimizni unutmang. Dastlabki vazifalardan so‘ng uni topaylik.','Mila es mi hermana. Yo cuidé a los pacientes y ella guio al grupo por el pantano. No te pido elegirla sobre la cura. Recuerda para quién la buscamos. Ayúdame a encontrarla.','Mila ist meine Schwester. Ich blieb bei den Patienten, sie führte Menschen durchs Moor. Du sollst sie nicht statt des Heilmittels wählen. Vergiss nur nicht, für wen wir es suchen. Hilf mir, sie zu finden.','Mila kardeşim. Ben hastalarla kaldım, o insanları bataklıktan geçirdi. Onu tedaviye tercih etmeni istemiyorum. Tedaviyi kimin için aradığımızı unutma. Onu bulmama yardım et.'],
  'personal.marat':['Я подписал отключение. Мне обещали исправный резерв для больницы. Вину проще носить молча, чем признаться людям. Найди приказ: не оправдание, а доказательство того, что произошло. Решение об архиве изменит, останется ли это тайной.','I signed the blackout order. They promised working hospital backup. Silence is easier than admitting it. Find the order, not as an excuse but as evidence. Your archive decision determines whether it stays secret.','Quvvat uzilishi buyrug‘ini imzolaganman. Kasalxona zaxirasi ishlaydi deyishgan. Tan olishdan ko‘ra sukut oson. Buyruqni toping: bahona emas, dalil. Arxiv qaroringiz sir saqlanishini belgilaydi.','Firmé el apagón. Prometieron reserva para el hospital. Callar es más fácil que admitirlo. Busca la orden: no una excusa, sino una prueba. Tu decisión sobre el archivo determinará si sigue siendo un secreto.','Ich unterschrieb die Abschaltung. Man versprach funktionierende Krankenhausreserven. Schweigen ist leichter als ein Geständnis. Finde den Befehl als Beweis, nicht als Ausrede. Deine Archiventscheidung bestimmt, ob es geheim bleibt.','Kesinti emrini imzaladım. Hastane yedeğinin çalışacağı söylendi. Susmak itiraf etmekten kolay. Emri bul: Bahane değil, kanıt. Arşiv kararın bunun sır kalıp kalmayacağını belirleyecek.'],
  'personal.vera':['Я умею слушать эфир, но долго боялась ответить. Можно спасти людей сейчас или ускорить лабораторию ради многих позже. Я отмечу оба пути. Когда Ада будет готова, выбери сам — и прими последствия.','I can listen, but I was afraid to answer. We can help people now or accelerate the lab to save more later. When Ada is ready, choose a path and accept its consequences.','Efirni tinglay olaman, lekin javobdan qo‘rqardim. Hozir odamlarga yordam berish yoki keyin ko‘proq odam uchun laboratoriyani tezlatish mumkin. Ada tayyor bo‘lganda yo‘lni o‘zingiz tanlang.','Sé escuchar, pero temía responder. Podemos ayudar ahora o acelerar el laboratorio para salvar a más después. Cuando Ada esté lista, elige y acepta las consecuencias.','Ich kann zuhören, hatte aber Angst zu antworten. Jetzt Menschen helfen oder das Labor für später beschleunigen? Wenn Ada bereit ist, wähle selbst und trage die Folgen.','Dinlemeyi biliyorum ama yanıtlamaktan korktum. Şimdi yardım edebilir ya da sonra daha çok kişiyi kurtarmak için laboratuvarı hızlandırabiliriz. Ada hazır olunca karar ver ve sonuçlarını kabul et.'],
  'personal.ada':['Я была частью программы NV-7. Я возражала против продолжения, но слишком долго верила, что исправлю ошибки изнутри. Лекарство не отменит прошлого. Найденный протокол должен остаться у людей — либо в защищённом архиве, если ты решишь иначе.','I was part of NV-7. I objected, yet believed too long that I could fix it from inside. A cure won’t erase the past. The protocol must remain with the people, or in a protected archive if you decide otherwise.','NV-7 dasturida ishlaganman. Qarshi bo‘lsam ham, ichkaridan tuzataman deb uzoq ishondim. Dori o‘tmishni o‘chirmaydi. Bayonnoma xalqda yoki siz tanlasangiz himoyalangan arxivda qoladi.','Formé parte de NV-7. Me opuse, pero creí demasiado tiempo que podría arreglarlo desde dentro. La cura no borrará el pasado. El protocolo quedará en manos del pueblo o en un archivo protegido, según decidas.','Ich gehörte zu NV-7. Ich widersprach, glaubte aber zu lange an eine Lösung von innen. Ein Heilmittel löscht die Vergangenheit nicht. Du entscheidest, ob das Protokoll öffentlich oder geschützt bleibt.','NV-7’nin parçasıydım. İtiraz ettim ama içeriden düzeltebileceğime fazla inandım. Tedavi geçmişi silmez. Protokolü halka açmak ya da korunan arşivde tutmak senin kararın.'],
  'reflection.leya':['В журнале есть голоса тех, кого объявили потерянными. Я помню их.','Those declared lost still have voices in the log. I remember them.','Yo‘qotilganlar ovozi jurnalda bor. Ularni eslayman.','El registro conserva sus voces. Los recuerdo.','Das Protokoll bewahrt ihre Stimmen. Ich erinnere mich.','Kayıtta onların sesleri var. Onları hatırlıyorum.'],'reflection.marat':['Ты видел мой приказ. Теперь я не могу прятаться за молчанием.','You saw my order. I can no longer hide in silence.','Buyrug‘imni ko‘rdingiz. Endi sukutga yashirinolmayman.','Viste mi orden. Ya no puedo esconderme en el silencio.','Du hast meinen Befehl gesehen. Ich kann mich nicht mehr verstecken.','Emrimi gördün. Artık sessizliğe saklanamam.'],'reflection.vera':['Спасибо, что сохранил радиограмму. Теперь сообщение не исчезнет.','Thank you for keeping the radio message. It won’t disappear now.','Radioxabarni saqlaganingiz uchun rahmat. U endi yo‘qolmaydi.','Gracias por conservar el mensaje. Ya no desaparecerá.','Danke, dass du den Funkspruch gesichert hast. Er wird bleiben.','Telsiz mesajını koruduğun için sağ ol. Artık kaybolmayacak.'],'reflection.ada':['Протокол объясняет цепь ошибок. Он не освобождает нас от ответственности.','The protocol explains the failures. It does not remove our responsibility.','Bayonnoma xatolarni tushuntiradi, javobgarlikni yo‘qotmaydi.','El protocolo explica los fallos, no borra nuestra responsabilidad.','Das Protokoll erklärt Fehler, nicht unsere Verantwortung weg.','Protokol hataları açıklar; sorumluluğumuzu kaldırmaz.'],'reflection.rescued':['Мила жива. Спасибо, что помог не только будущему, но и человеку рядом.','Mila is alive. You helped a person, not only a future.','Mila tirik. Faqat kelajakka emas, insonga ham yordam berdingiz.','Mila vive. Ayudaste a una persona, no solo al futuro.','Mila lebt. Du halfst einem Menschen, nicht nur der Zukunft.','Mila yaşıyor. Yalnız geleceğe değil, bir insana yardım ettin.'],'reflection.lost':['Я буду помнить Милу. Доведём дело до конца ради тех, кого ещё можно спасти.','I will remember Mila. We must finish this for those we can still save.','Milani eslayman. Hali qutqarish mumkinlar uchun ishni yakunlaylik.','Recordaré a Mila. Terminemos por quienes aún podemos salvar.','Ich werde Mila nicht vergessen. Für die übrigen müssen wir es vollenden.','Mila’yı unutmayacağım. Kurtarabileceklerimiz için bitirelim.'],
  rescueTitle:['Голоса в тумане','Voices in the fog','Tumandagi ovozlar','Voces en la niebla','Stimmen im Nebel','Sisteki sesler'],rescueHint:['После доставки медицинского кейса поговори с Леей о её сестре.','After delivering the medical case, ask Leya about her sister.','Tibbiy qutini topshirgach, Leyadan singlisi haqida so‘rang.','Tras entregar el maletín médico, pregunta a Leya por su hermana.','Frage Leya nach der Übergabe des Medizinkoffers nach ihrer Schwester.','Tıbbi çantayı teslim ettikten sonra Leya’ya kardeşini sor.'],acceptRescue:['Я найду Милу','I’ll find Mila','Milani topaman','Encontraré a Mila','Ich finde Mila','Mila’yı bulacağım'],rescueAccepted:['Мила отмечена на карте. Приготовь 2 воды и 1 фасоль.','Mila marked on the map. Bring 2 water and 1 beans.','Mila xaritada belgilandi. 2 suv va 1 loviya tayyorlang.','Mila está en el mapa. Lleva 2 aguas y 1 lata de judías.','Mila ist markiert. Bring 2 Wasser und 1 Bohnen.','Mila haritada. 2 su ve 1 fasulye getir.'],
  rescueAccept:['Найди Милу в хижине на болотах.','Find Mila in the marsh cabin.','Milani botqoq kulbasidan toping.','Busca a Mila en la cabaña del pantano.','Finde Mila in der Moorhütte.','Bataklık kulübesinde Mila’yı bul.'],rescueTreat:['Передай Миле 2 воды и 1 консервированную фасоль.','Give Mila 2 water and 1 canned beans.','Milaga 2 suv va 1 konservalangan loviya bering.','Dale 2 aguas y 1 lata de judías a Mila.','Gib Mila 2 Wasser und 1 Dosenbohnen.','Mila’ya 2 su ve 1 konserve fasulye ver.'],rescueEscort:['Приведи Милу в закрытое убежище с кроватью и шкафом.','Lead Mila into a closed shelter with a bed and wardrobe.','Milani karavot va shkafli yopiq boshpanaga olib boring.','Lleva a Mila a un refugio cerrado con cama y armario.','Führe Mila in eine geschlossene Unterkunft mit Bett und Schrank.','Mila’yı yatak ve dolabı olan kapalı sığınağa götür.'],rescueWaiting:['Мила ждёт. Поговори с ней, чтобы продолжить путь.','Mila is waiting. Talk to her to continue.','Mila kutmoqda. Davom etish uchun gaplashing.','Mila espera. Habla con ella para continuar.','Mila wartet. Sprich mit ihr, um weiterzugehen.','Mila bekliyor. Devam için onunla konuş.'],
  'mila.intro':['Ты от Леи? Я вывела группу сюда, но больше не могу идти без воды. Поговори с ней после первых дел.','Did Leya send you? I brought the group here, but need water to walk. Talk to her after your first tasks.','Leya yubordimi? Guruhni shu yerga olib keldim. Yurishta suv kerak. Dastlabki ishlardan so‘ng u bilan gaplashing.','¿Te envía Leya? Traje al grupo, pero necesito agua para seguir. Habla con ella.','Kommst du von Leya? Ich brachte die Gruppe her, brauche aber Wasser zum Weitergehen. Sprich mit ihr.','Leya mı gönderdi? Grubu buraya getirdim ama yürümek için su lazım. Onunla konuş.'],
  'mila.treatment':['Я пойду с тобой, если получу 2 воды и 1 фасоль. Нам нужна закрытая дверь, кровать и шкаф. Не закрывай дверь, пока я снаружи.','I can follow after 2 water and 1 beans. We need a closed shelter, bed and wardrobe. Don’t shut the door while I’m outside.','2 suv va 1 loviyadan keyin ergasha olaman. Yopiq boshpana, karavot va shkaf kerak. Tashqarida qolsam eshikni yopmang.','Te seguiré con 2 aguas y 1 lata de judías. Necesitamos cama, armario y puerta cerrada. No cierres antes de que entre.','Mit 2 Wasser und 1 Bohnen kann ich folgen. Wir brauchen Bett, Schrank und eine geschlossene Tür. Sperr mich nicht aus.','2 su ve 1 fasulyeden sonra gelebilirim. Kapalı kapı, yatak ve dolap lazım. Ben dışarıdayken kapatma.'],
  'mila.following':['Я рядом. Можешь попросить меня подождать, пока разведуешь путь.','I’m here. Ask me to wait while you scout ahead.','Yonizdaman. Yo‘lni tekshirganda kutishimni so‘rang.','Te sigo. Puedo esperar mientras exploras.','Ich bin da. Ich kann warten, während du erkundest.','Buradayım. Keşif yaparken beklememi isteyebilirsin.'],'mila.waiting':['Я подожду здесь. Скажи, когда идти дальше.','I’ll wait here. Tell me when to move.','Shu yerda kutaman. Qachon yurishni ayting.','Esperaré aquí. Avísame para seguir.','Ich warte hier. Sag, wann wir weitergehen.','Burada beklerim. Devam edince söyle.'],'mila.safe':['Мила в безопасности. Лея знает, что сестра выжила.','Mila is safe. Leya knows her sister survived.','Mila xavfsiz. Leya singlisi tirikligini biladi.','Mila está a salvo. Leya sabe que sobrevivió.','Mila ist sicher. Leya weiß, dass ihre Schwester lebt.','Mila güvende. Leya kardeşinin yaşadığını biliyor.'],
  'dialogue.mila.idle':['Мне нужна помощь.','I need help.','Yordam kerak.','Necesito ayuda.','Ich brauche Hilfe.','Yardıma ihtiyacım var.'],'dialogue.mila.sandbox':['В песочнице нет обязательных спасательных заданий. Исследуй болота и береги питьевую воду.','Sandbox has no mandatory rescue quests. Explore the marsh and save drinking water.','Erkin rejimda majburiy qutqaruv yo‘q. Botqoqni o‘rganing, suvni tejang.','No hay rescates obligatorios. Explora el pantano y ahorra agua.','Hier gibt es keine Pflichtrettung. Erkunde das Moor und spare Wasser.','Zorunlu kurtarma yok. Bataklığı keşfet, içme suyunu koru.'],
  'action.acceptRescue':['Я помогу тебе','I’ll help you','Yordam beraman','Te ayudaré','Ich helfe dir','Yardım edeceğim'],'action.treatMila':['Передать припасы и идти вместе','Give supplies and travel together','Zaxira berib birga yurish','Dar provisiones e ir juntos','Vorräte geben und gemeinsam gehen','Erzak ver ve birlikte yürü'],'action.waitMila':['Подождать / продолжить путь','Wait / continue travelling','Kutish / yo‘lni davom ettirish','Esperar / continuar','Warten / weitergehen','Bekle / devam et'],escortStarted:['Мила идёт с тобой. Защищай её и не забывай про двери.','Mila is following. Protect her and watch the doors.','Mila ergashmoqda. Uni himoya qiling, eshiklarni unutmang.','Mila te sigue. Protégela y vigila las puertas.','Mila folgt dir. Schütze sie und achte auf Türen.','Mila seni izliyor. Onu koru, kapılara dikkat et.'],milaLost:['Мила погибла. Это отразится на истории Леи и финале.','Mila died. Leya’s story and the ending will reflect this.','Mila halok bo‘ldi. Leya hikoyasi va yakunda aks etadi.','Mila murió. Afectará a Leya y al final.','Mila ist gestorben. Das prägt Leya und das Ende.','Mila öldü. Leya’nın hikâyesi ve son bundan etkilenecek.'],milaRescued:['Мила в безопасном убежище. Награда: 45 опыта и 2 супа.','Mila reached safety. Reward: 45 XP and 2 soups.','Mila xavfsiz. Mukofot: 45 tajriba va 2 sho‘rva.','Mila está a salvo: 45 EXP y 2 sopas.','Mila ist sicher: 45 EP und 2 Suppen.','Mila güvende: 45 DP ve 2 çorba.'],escortHealth:['Мила','Mila','Mila','Mila','Mila','Mila'],waiting:['ждёт','waiting','kutmoqda','esperando','wartet','bekliyor'],trackRescue:['Отслеживать спасение','Track rescue','Qutqaruvni kuzatish','Seguir rescate','Rettung verfolgen','Kurtarmayı takip et'],trackMain:['Вернуть основную цель','Track main objective','Asosiy maqsadga qaytish','Seguir objetivo principal','Hauptziel verfolgen','Ana hedefi takip et'],
  priorityLabel:['Кому помочь первым?','Who comes first?','Avval kimga yordam?','¿A quién ayudar primero?','Wer kommt zuerst?','Önce kime yardım?'],archiveLabel:['Что делать с архивом?','What happens to the archive?','Arxiv taqdiri?','¿Qué hacer con el archivo?','Was geschieht mit dem Archiv?','Arşive ne olacak?'],
  'dilemma.priority':['Припасы можно направить выжившим или лаборатории. Лекарство появится в любом случае, но люди запомнят, что было для тебя важнее.','Supplies can support survivors or the lab. Both paths produce a cure, but people will remember your priority.','Zaxira tiriklarga yoki laboratoriyaga beriladi. Ikkala yo‘l ham doriga olib boradi, lekin ustuvorligingiz yodda qoladi.','Las provisiones pueden ayudar al grupo o al laboratorio. Ambos caminos logran la cura, pero recordarán tu prioridad.','Vorräte können Menschen oder dem Labor helfen. Beide Wege führen zum Heilmittel, doch deine Priorität bleibt in Erinnerung.','Erzak kurtulanlara veya laboratuvara gidebilir. Her iki yol tedaviye ulaşır, ama önceliğin hatırlanır.'],
  'dilemma.archive':['Прототип готов. Публикация протокола раскроет ошибки штаба, Марата и Ады. Закрытый архив защитит убежище от споров сейчас, но правда останется у немногих.','The prototype is ready. Publishing exposes failures by command, Marat and Ada. Sealing the archive protects the shelter from conflict now, but leaves the truth with a few.','Prototip tayyor. Ochiq bayonnoma shtab, Marat va Ada xatolarini oshkor qiladi. Yopiq arxiv boshpanani nizodan asraydi, ammo haqiqat ozchilikda qoladi.','Publicar revelará los errores del mando, Marat y Ada. Sellarlo evitará conflictos ahora, pero pocos conocerán la verdad.','Eine Veröffentlichung deckt Fehler von Stab, Marat und Ada auf. Versiegelung vermeidet zunächst Streit, lässt die Wahrheit aber bei wenigen.','Yayımlamak komuta, Marat ve Ada’nın hatalarını açığa çıkarır. Kapatmak çatışmayı önler ama gerçeği az kişide bırakır.'],
  'choice.aid':['Сначала выжившие','Survivors first','Avval tiriklar','Primero los supervivientes','Überlebende zuerst','Önce kurtulanlar'],'choice.research':['Сначала исследование','Research first','Avval tadqiqot','Primero la investigación','Forschung zuerst','Önce araştırma'],'choice.open':['Открыть документы','Publish the archive','Hujjatlarni ochish','Publicar el archivo','Archiv veröffentlichen','Arşivi yayımla'],'choice.sealed':['Сохранить архив закрытым','Seal the archive','Arxivni yopiq saqlash','Sellar el archivo','Archiv versiegeln','Arşivi kapalı tut'],
  'choiceDesc.aid':['+2 воды, +2 супа и доверие Леи. Лабораторный цикл займёт 110 секунд.','+2 water, +2 soups and Leya’s trust. Lab cycle: 110 seconds.','+2 suv, +2 sho‘rva va Leya ishonchi. Laboratoriya: 110 soniya.','+2 aguas, +2 sopas y confianza de Leya. Ciclo: 110 s.','+2 Wasser, +2 Suppen und Leyas Vertrauen. Zyklus: 110 Sekunden.','+2 su, +2 çorba ve Leya’nın güveni. Süre: 110 saniye.'],
  'choiceDesc.research':['+2 металла, +6 винтовочных патронов и доверие Ады. Цикл займёт 75 секунд.','+2 metal, +6 rifle rounds and Ada’s trust. Lab cycle: 75 seconds.','+2 metall, +6 miltiq o‘qi va Ada ishonchi. Jarayon: 75 soniya.','+2 metales, +6 balas de rifle y confianza de Ada. Ciclo: 75 s.','+2 Metall, +6 Gewehrpatronen und Adas Vertrauen. Zyklus: 75 Sekunden.','+2 metal, +6 tüfek mermisi ve Ada’nın güveni. Süre: 75 saniye.'],
  'choiceDesc.open':['+40 опыта. В эпилоге появится открытое расследование причин вспышки.','+40 XP. The epilogue includes a public outbreak inquiry.','+40 tajriba. Yakunda epidemiyaga ochiq tergov boshlanadi.','+40 EXP. El epílogo incluye una investigación pública.','+40 EP. Im Epilog beginnt eine öffentliche Untersuchung.','+40 DP. Son bölümde halka açık soruşturma başlar.'],
  'choiceDesc.sealed':['Надетая броня восстановит 20 прочности. Документы останутся в защищённом хранилище.','Equipped armor regains 20 condition. Documents stay in protected storage.','Kiyilgan zirh 20 mustahkamlikni tiklaydi. Hujjatlar himoyalangan joyda qoladi.','La armadura equipada recupera 20 de estado. Los documentos quedan protegidos.','Angelegte Rüstung erhält 20 Zustand. Die Dokumente bleiben geschützt.','Takılı zırh 20 dayanıklılık kazanır. Belgeler korunan depoda kalır.'],
  choose:['Выбрать','Choose','Tanlash','Elegir','Wählen','Seç'],choicePermanent:['Решение сохраняется и меняет эпилог.','This decision is saved and changes the epilogue.','Qaror saqlanadi va yakunga ta’sir qiladi.','La decisión se guarda y cambia el epílogo.','Die Entscheidung wird gespeichert und verändert den Epilog.','Karar kaydedilir ve son bölümü değiştirir.'],
  'priority.aid':['Помощь выжившим','Aid to survivors','Tiriklarga yordam','Ayuda a supervivientes','Hilfe für Überlebende','Kurtulanlara yardım'],'priority.research':['Ускорение исследования','Accelerated research','Tezlashtirilgan tadqiqot','Investigación acelerada','Beschleunigte Forschung','Hızlı araştırma'],'priority.balanced':['Продолжение прежнего плана','Continuing the old plan','Eski rejani davom ettirish','Continuar el plan anterior','Bisherigen Plan fortsetzen','Eski planı sürdürme'],'priority.undecided':['Ещё не выбрано','Not chosen yet','Hali tanlanmagan','Sin decidir','Noch offen','Henüz seçilmedi'],'archive.open':['Публичный архив','Public archive','Ochiq arxiv','Archivo público','Öffentliches Archiv','Halka açık arşiv'],'archive.sealed':['Защищённый архив','Protected archive','Himoyalangan arxiv','Archivo protegido','Geschütztes Archiv','Korumalı arşiv'],'archive.undecided':['Ещё не выбрано','Not chosen yet','Hali tanlanmagan','Sin decidir','Noch offen','Henüz seçilmedi'],
  yourLegacy:['Твоё наследие','Your legacy','Sizning merosingiz','Tu legado','Dein Vermächtnis','Mirasın'],epilogueTruth:['Правду удалось сохранить, даже если не всё было найдено.','The truth was preserved, even if some pieces remain missing.','Hammasi topilmasa ham, haqiqat saqlandi.','La verdad se conservó, aunque falten piezas.','Die Wahrheit blieb erhalten, auch wenn Teile fehlen.','Bazı parçalar eksik olsa da gerçek korundu.'],
  'epilogue.rescued':['Мила выжила. Лея закончила разработку, зная, что сестра дождётся встречи.','Mila survived. Leya finished the cure knowing her sister would be there.','Mila tirik qoldi. Leya singlisi kutishini bilib dorini yakunladi.','Mila sobrevivió. Leya terminó sabiendo que volverían a verse.','Mila überlebte. Leya vollendete das Heilmittel in Hoffnung auf ein Wiedersehen.','Mila hayatta kaldı. Leya kardeşine kavuşacağını bilerek tedaviyi bitirdi.'],
  'epilogue.lost':['Мила не вернулась. Для Леи лекарство стало обещанием тем, кого не успели спасти.','Mila did not return. The cure became Leya’s promise to those not saved in time.','Mila qaytmadi. Dori Leya uchun qutqarilmaganlarga va’da bo‘ldi.','Mila no regresó. La cura fue la promesa de Leya a quienes no pudieron salvar.','Mila kehrte nicht zurück. Das Heilmittel wurde Leyas Versprechen an die Verlorenen.','Mila dönmedi. Tedavi, Leya’nın zamanında kurtarılamayanlara sözü oldu.'],
  'epilogue.missing':['Судьба Милы осталась неизвестной. После разработки Лея возобновила поиски.','Mila’s fate remains unknown. Leya resumed searching after completing the cure.','Mila taqdiri noma’lum. Dori tayyor bo‘lgach, Leya qidiruvni davom ettirdi.','Se desconoce el destino de Mila. Leya reanudó la búsqueda tras la cura.','Milas Schicksal blieb ungewiss. Nach dem Heilmittel suchte Leya weiter.','Mila’nın kaderi bilinmiyor. Tedavi bitince Leya aramaya devam etti.'],
  'epilogue.aid':['Сначала ты помог выжившим. К первой партии лекарства подошла уже готовая сеть убежищ.','You helped survivors first. A shelter network was ready for the first cure shipment.','Avval tiriklarga yordam berdingiz. Birinchi dori partiyasiga boshpanalar tarmog‘i tayyor edi.','Ayudaste primero al grupo. La red de refugios esperaba la primera partida.','Du halfst zuerst den Menschen. Ein Netz von Unterkünften erwartete das Heilmittel.','Önce kurtulanlara yardım ettin. İlk tedavi sevkiyatına sığınak ağı hazırdı.'],
  'epilogue.research':['Ты ускорил исследование. Лекарство появилось раньше, но восстановление убежищ ещё впереди.','You accelerated research. The cure arrived sooner, but shelter recovery still lies ahead.','Tadqiqotni tezlatdingiz. Dori ertaroq tayyor, lekin boshpanalarni tiklash hali oldinda.','Aceleraste el estudio. La cura llegó antes, pero los refugios aún deben recuperarse.','Du beschleunigtest die Forschung. Das Heilmittel kam früher, der Wiederaufbau steht noch aus.','Araştırmayı hızlandırdın. Tedavi erken geldi ama sığınaklar hâlâ onarılmalı.'],
  'epilogue.open':['Протокол опубликован. Марат и Ада дали показания, а приказ о молчании стал частью открытого расследования.','The protocol was published. Marat and Ada testified, and the silence order became public evidence.','Bayonnoma e’lon qilindi. Marat va Ada guvohlik berdi, sukut buyrug‘i ochiq dalilga aylandi.','El protocolo se publicó. Marat y Ada declararon y la orden de silencio se investigó.','Das Protokoll wurde veröffentlicht. Marat und Ada sagten aus; der Schweigebefehl wurde untersucht.','Protokol yayımlandı. Marat ve Ada ifade verdi, sessizlik emri soruşturmaya girdi.'],
  'epilogue.sealed':['Архив закрыт, чтобы защитить убежище. Лекарство создано, но спор о правде ещё вернётся.','The archive was sealed to protect the shelter. The cure exists, but the truth will return to haunt it.','Boshpanani himoya qilish uchun arxiv yopildi. Dori yaratildi, ammo haqiqat masalasi yana qaytadi.','El archivo quedó sellado para proteger el refugio. Hay cura, pero la verdad volverá.','Das Archiv blieb zum Schutz versiegelt. Das Heilmittel ist da, doch die Wahrheit bleibt ungeklärt.','Sığınağı korumak için arşiv kapatıldı. Tedavi var ama gerçek tartışması geri dönecek.'],
});
